<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aqua">
<meta name="theme-color" content="#a9dcff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Aqua Finanzas</title>
<style>
:root{
  --sky-a:#a9dcff; --sky-b:#dff3ff; --sky-c:#eafff3;
  --glow:rgba(255,255,255,.9);
  --text:#0a1a2b; --muted:#566a7e; --faint:#8a9bad;
  --glass:rgba(255,255,255,.56); --glass-strong:rgba(255,255,255,.82);
  --glass-border:rgba(255,255,255,.9); --hair:rgba(10,40,70,.09);
  --track:rgba(110,140,170,.18);
  --shadow:0 12px 30px -14px rgba(20,90,160,.4), 0 2px 6px rgba(20,90,160,.07);
  --aqua:#0a96ec; --teal:#14c7a5; --pos:#12a150; --neg:#e5333f; --warn:#ff9500;
  --bubble:rgba(255,255,255,.5);
  --thumb:rgba(255,255,255,.95);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky-a:#031426; --sky-b:#072a47; --sky-c:#052c27;
    --glow:rgba(60,170,255,.22);
    --text:#eaf6ff; --muted:#9fb6ca; --faint:#6c8399;
    --glass:rgba(16,38,62,.55); --glass-strong:rgba(22,46,74,.9);
    --glass-border:rgba(150,210,255,.15); --hair:rgba(160,210,255,.1);
    --track:rgba(160,200,240,.12);
    --shadow:0 14px 34px -14px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.3);
    --pos:#3ddc84; --neg:#ff6b74;
    --bubble:rgba(130,210,255,.16);
    --thumb:rgba(255,255,255,.17);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky-a:#031426; --sky-b:#072a47; --sky-c:#052c27;
  --glow:rgba(60,170,255,.22);
  --text:#eaf6ff; --muted:#9fb6ca; --faint:#6c8399;
  --glass:rgba(16,38,62,.55); --glass-strong:rgba(22,46,74,.9);
  --glass-border:rgba(150,210,255,.15); --hair:rgba(160,210,255,.1);
  --track:rgba(160,200,240,.12);
  --shadow:0 14px 34px -14px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.3);
  --pos:#3ddc84; --neg:#ff6b74;
  --bubble:rgba(130,210,255,.16);
  --thumb:rgba(255,255,255,.17);
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);color:var(--text);background:var(--sky-b);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
body.noscroll{overflow:hidden}
input,textarea{-webkit-user-select:text;user-select:text}
button{font-family:inherit;color:inherit;cursor:pointer}

/* ---------- Cielo Frutiger Aero ---------- */
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:
    radial-gradient(120% 55% at 15% -5%, var(--glow), transparent 60%),
    radial-gradient(70% 45% at 100% 35%, rgba(90,210,255,.35), transparent 70%),
    radial-gradient(90% 55% at 0% 100%, rgba(90,235,180,.35), transparent 70%),
    linear-gradient(180deg,var(--sky-a),var(--sky-b) 50%,var(--sky-c));}
.aurora{position:absolute;width:150vmax;height:150vmax;left:-25vmax;top:-70vmax;
  background:conic-gradient(from 0deg,rgba(54,198,255,.28),rgba(20,199,165,.22),rgba(139,92,246,.14),rgba(54,198,255,.28));
  filter:blur(70px);animation:spin 50s linear infinite;opacity:.8}
.bubble{position:absolute;bottom:-140px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 7%,rgba(255,255,255,.35) 17%,var(--bubble) 45%,rgba(255,255,255,.06) 72%);
  box-shadow:inset -5px -8px 16px rgba(255,255,255,.22),inset 3px 5px 9px rgba(255,255,255,.35),0 0 0 1px rgba(255,255,255,.3);
  animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0)}50%{transform:translate(24px,-60vh)}100%{transform:translate(-14px,-125vh)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Layout ---------- */
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 120px)}
.view-anim{animation:viewIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px) scale(.99)}}
.stagger>*{animation:itemIn .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 40ms)}
@keyframes itemIn{from{opacity:0;transform:translateY(12px)}}

.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 16px}
.hello small{display:block;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.hello h1{margin:2px 0 0;font-size:31px;font-weight:800;letter-spacing:-.025em}
.large{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px;min-height:46px}
.large h1{margin:0;font-size:32px;font-weight:800;letter-spacing:-.025em}
.avatar{width:44px;height:44px;border-radius:50%;border:0;font-size:19px;font-weight:800;color:#fff;
  background:radial-gradient(circle at 50% 30%,#8fe3ff,#18a8f5 50%,#0a6fd6);position:relative;overflow:hidden;
  box-shadow:0 6px 16px -6px rgba(10,130,230,.8),inset 0 -3px 8px rgba(0,40,120,.35),inset 0 1px 1px rgba(255,255,255,.8)}
.avatar::before,.fab::before,.btn::before,.hero::before,.mini-ico::before,.cat-ico::before,.set-ico::before,.av::before{content:"";position:absolute;left:8%;right:8%;top:3%;height:48%;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;
  background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,.08));pointer-events:none}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--glass-border);box-shadow:var(--shadow);border-radius:22px}
.card{padding:16px;margin-bottom:14px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:24px 4px 10px}
.sec h3{margin:0;font-size:20px;font-weight:800;letter-spacing:-.015em}
.sec button{border:0;background:none;color:var(--aqua);font-weight:650;font-size:15px;padding:0}
.tap{transition:transform .18s cubic-bezier(.3,1.4,.5,1),opacity .18s}
.tap:active{transform:scale(.965);opacity:.85}
.pos{color:var(--pos)!important}.neg{color:var(--neg)!important}
.muted{color:var(--muted)}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:30px;padding:18px 20px 18px;color:#fff;margin-bottom:14px;
  background:linear-gradient(160deg,#3fcbff 0%,#0a8ee8 48%,#0b5fc6 100%);
  box-shadow:0 20px 40px -18px rgba(10,120,220,.85),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -10px 30px rgba(0,30,100,.25)}
.hero::before{left:-10%;right:-10%;top:-55%;height:100%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.04))}
.hero::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);animation:shine 6s ease-in-out 1s infinite;pointer-events:none}
@keyframes shine{0%,70%{left:-60%}100%{left:130%}}
.hero.green{background:linear-gradient(160deg,#4fe3b8 0%,#12b07c 50%,#0a7d5e 100%);box-shadow:0 20px 40px -18px rgba(10,160,110,.85),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -10px 30px rgba(0,60,40,.25)}
.hero.orange{background:linear-gradient(160deg,#ffc56b 0%,#ff8a3d 50%,#e8513a 100%);box-shadow:0 20px 40px -18px rgba(230,100,50,.85),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -10px 30px rgba(100,30,0,.25)}
.hero-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.hero .label{font-size:14px;font-weight:700;opacity:.92}
.hero .big{position:relative;z-index:1;font-size:40px;font-weight:800;letter-spacing:-.03em;margin:8px 0 14px;font-variant-numeric:tabular-nums;text-shadow:0 2px 10px rgba(0,40,110,.25);word-break:break-all}
.hero .sub{position:relative;z-index:1;font-size:14px;opacity:.9;font-weight:600}
.pills{display:flex;gap:10px;position:relative;z-index:1}
.pill{flex:1;min-width:0;background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.35);border-radius:17px;padding:10px 12px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pill small{display:block;font-size:12px;font-weight:650;opacity:.88}
.pill b{display:block;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mnav{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:2px;font-size:13px;font-weight:700}
.mnav button{border:0;background:none;color:inherit;width:28px;height:26px;font-size:18px;line-height:1;border-radius:14px}
.mnav button:active{background:rgba(255,255,255,.25)}

/* ---------- Mini cards ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:4px}
.mini{text-align:left;padding:14px;border-radius:22px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mini small{color:var(--muted);font-weight:650;font-size:13px;margin-top:8px}
.mini b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-ico,.cat-ico,.set-ico,.av{position:relative;overflow:hidden;display:grid;place-items:center;flex:none}
.mini-ico{width:36px;height:36px;border-radius:12px;font-size:19px;background:var(--c);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 45%,white),var(--c));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 5px 12px -5px var(--c)}
.cat-ico{width:42px;height:42px;border-radius:14px;font-size:21px;background:var(--c);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 40%,white),color-mix(in srgb,var(--c) 85%,black));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 5px 12px -6px var(--c);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}

/* ---------- Lists ---------- */
.list{padding:4px 0;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;border:0;background:none;text-align:left;position:relative}
.list>.row+.row::before{content:"";position:absolute;top:0;left:68px;right:0;height:1px;background:var(--hair)}
.meta{flex:1;min-width:0}
.meta .t{font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .s{font-size:13px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:16px}
.chev{color:var(--faint);font-size:20px;margin-left:2px}
.dayhead{display:flex;justify-content:space-between;margin:18px 6px 8px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.sumline{display:flex;gap:10px;margin:4px 0 0}
.sumline>div{flex:1;padding:12px 14px;border-radius:18px}
.sumline small{display:block;color:var(--muted);font-weight:650;font-size:12px}
.sumline b{font-size:17px;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:34px 20px;color:var(--muted)}
.empty .em{font-size:46px;display:block;margin-bottom:8px;animation:float 3s ease-in-out infinite}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
@keyframes float{50%{transform:translateY(-8px)}}

/* ---------- Segmented / search / month bar ---------- */
.seg{display:flex;position:relative;background:var(--track);border-radius:13px;padding:3px;margin-bottom:12px}
.seg button{flex:1;position:relative;z-index:1;border:0;background:none;padding:8px 0;font-weight:650;font-size:14px;border-radius:10px;transition:color .2s}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;border-radius:10px;background:var(--thumb);box-shadow:0 3px 10px rgba(0,30,70,.13),inset 0 1px 0 rgba(255,255,255,.6);
  transition:left .38s cubic-bezier(.3,1.25,.5,1),width .38s cubic-bezier(.3,1.25,.5,1)}
.search{display:flex;align-items:center;gap:8px;padding:0 14px;margin-bottom:12px;border-radius:16px}
.search svg{width:18px;height:18px;color:var(--faint);flex:none}
.search input{flex:1;border:0;background:none;outline:none;font:500 16px var(--font);color:var(--text);padding:12px 0;min-width:0}
.mbar{display:flex;align-items:center;justify-content:space-between;padding:6px;border-radius:18px;margin-bottom:12px}
.mbar b{font-size:16px}
.mbar button{width:38px;height:34px;border-radius:12px;border:0;background:none;font-size:22px;color:var(--aqua)}
.mbar button:active{background:var(--track)}

/* ---------- Charts ---------- */
.donut-card{display:flex;align-items:center;gap:16px}
.donut{position:relative;width:136px;height:136px;flex:none}
.donut svg{width:100%;height:100%;overflow:visible}
.donut circle.s{transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1)}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 22px}
.donut-center small{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.donut-center b{font-size:14px;font-variant-numeric:tabular-nums;word-break:break-all;line-height:1.15}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.lg{display:flex;align-items:center;gap:8px;font-size:14px}
.lg i{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:inset 0 1px 1px rgba(255,255,255,.6)}
.lg span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg b{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.bars{display:flex;justify-content:space-between;align-items:flex-end;height:150px;gap:6px;padding-top:6px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.bpair{flex:1;display:flex;align-items:flex-end;gap:4px;width:100%;justify-content:center}
.bpair i{width:12px;height:0;border-radius:6px 6px 3px 3px;transition:height 1s cubic-bezier(.2,.8,.2,1);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
i.bi{background:linear-gradient(180deg,#5ef0b8,#12a96f)}
i.bg{background:linear-gradient(180deg,#6fd8ff,#0a86e0)}
.bcol span{font-size:12px;font-weight:650;color:var(--faint);text-transform:capitalize}
.bcol.cur span{color:var(--aqua)}
.blegend{display:flex;gap:16px;justify-content:center;margin-top:12px;font-size:13px;color:var(--muted);font-weight:600}
.blegend span{display:flex;align-items:center;gap:6px}
.blegend i{width:10px;height:10px;border-radius:4px;display:inline-block}

/* ---------- Bars / rings ---------- */
.bar{height:9px;border-radius:6px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--teal),var(--aqua));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bar.warn i{background:linear-gradient(90deg,#ffcc4d,#ff9500)}
.bar.over i{background:linear-gradient(90deg,#ff8a80,#ff3b47)}
.ring circle.p{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.goals-row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:4px 16px 14px;scrollbar-width:none}
.goals-row::-webkit-scrollbar{display:none}
.gmini{flex:0 0 150px;scroll-snap-align:start;padding:14px;border-radius:22px;text-align:left;display:flex;flex-direction:column;gap:6px}
.gmini .rw{position:relative;width:54px;height:54px}
.gmini .rw span{position:absolute;inset:0;display:grid;place-items:center;font-size:22px}
.gmini b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gmini small{font-size:12px;color:var(--muted);font-weight:600}

/* ---------- Alerts ---------- */
.alert-row{display:flex;align-items:center;gap:12px;padding:12px 14px}
.alert-row+.alert-row{border-top:1px solid var(--hair)}
.chip{font-size:12px;font-weight:750;padding:5px 10px;border-radius:20px;white-space:nowrap;border:0}
.chip.ok{background:rgba(18,161,80,.14);color:var(--pos)}
.chip.warn{background:rgba(255,149,0,.16);color:#d97a00}
.chip.bad{background:rgba(229,51,63,.14);color:var(--neg)}
.chip.go{background:linear-gradient(180deg,#4fd0ff,#0a8ee8);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 10px -4px rgba(10,140,230,.8)}

/* ---------- Debts ---------- */
.dcard{width:100%;text-align:left;padding:14px;border-radius:22px;margin-bottom:10px;display:block}
.dcard .top-r{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.av{width:44px;height:44px;border-radius:50%;color:#fff;font-weight:800;font-size:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 5px 12px -6px rgba(0,0,0,.4);text-shadow:0 1px 2px rgba(0,0,0,.2)}
.av.xl{width:76px;height:76px;font-size:32px;margin:0 auto 10px}
.dcard.closed{opacity:.6}
.toggle-link{display:block;margin:14px auto;border:0;background:none;color:var(--aqua);font-weight:650;font-size:15px}

/* ---------- Settings ---------- */
.group{margin-bottom:18px;overflow:hidden}
.set{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;border:0;background:none;text-align:left;font-size:16px;position:relative}
.group>.set+.set::before{content:"";position:absolute;top:0;left:58px;right:0;height:1px;background:var(--hair)}
.set .lbl{flex:1;font-weight:550}
.set .val{color:var(--muted);font-size:15px}
.set-ico{width:31px;height:31px;border-radius:9px;font-size:16px;background:var(--c);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.set.danger .lbl{color:var(--neg)}
.profile{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:18px;width:100%;text-align:left}
.profile .avatar{width:60px;height:60px;font-size:26px}
.profile b{font-size:20px;display:block}
.foot{text-align:center;color:var(--faint);font-size:13px;line-height:1.5;margin:22px 10px}
.back{display:flex;align-items:center;gap:2px;border:0;background:none;color:var(--aqua);font-size:17px;font-weight:600;padding:6px 0;margin:0 0 4px -4px}
.back span{font-size:26px;line-height:1;margin-top:-3px}
.slide-in{animation:slideIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}}
.budget-row{padding:12px 14px}
.budget-row+.budget-row{border-top:1px solid var(--hair)}
.budget-row .hd{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.budget-row input{width:110px;text-align:right;padding:9px 10px;font-size:16px}
.hint{font-size:13px;color:var(--muted);margin:0 6px 12px;line-height:1.45}
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.35}
.banner .x{flex:none}

/* ---------- Buttons ---------- */
.btn{position:relative;overflow:hidden;border:0;border-radius:17px;padding:15px 18px;width:100%;font-weight:750;font-size:17px;color:#fff;
  background:linear-gradient(180deg,#4fd0ff,#0a94ec 55%,#0a72d6);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 8px rgba(0,50,140,.3),0 12px 24px -12px rgba(10,120,220,.9);
  transition:transform .18s cubic-bezier(.3,1.4,.5,1),filter .2s}
.btn:active{transform:scale(.97);filter:brightness(1.05)}
.btn::before{top:2px;left:4%;right:4%;height:50%;border-radius:15px 15px 40% 40%}
.btn.green{background:linear-gradient(180deg,#5cf0bf,#14b57d 55%,#0b8e62);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 8px rgba(0,80,50,.3),0 12px 24px -12px rgba(10,150,100,.9)}
.btn.red{background:linear-gradient(180deg,#ff8c8c,#f0444f 55%,#c92735);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 8px rgba(120,0,20,.3),0 12px 24px -12px rgba(200,40,50,.9)}

.burst{position:fixed;z-index:95;pointer-events:none;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#fff 0 10%,rgba(120,220,255,.7) 40%,rgba(80,200,160,.3) 75%);
  animation:burst 1.3s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .bubble,.aurora{display:none}
}

<script>
'use strict';
/* =========================================================
   Aqua Finanzas — todo se guarda en este dispositivo
   ========================================================= */
const KEY = 'aqua-finanzas-v1';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const CATS = {
  gasto: [
    {id:'comida', n:'Comida', e:'🍔', c:'#ff9f0a'},
    {id:'super', n:'Súper', e:'🛒', c:'#30d158'},
    {id:'transporte', n:'Transporte', e:'🚗', c:'#0a84ff'},
    {id:'casa', n:'Casa', e:'🏠', c:'#5e5ce6'},
    {id:'servicios', n:'Servicios', e:'💡', c:'#ffcc00'},
    {id:'salud', n:'Salud', e:'💊', c:'#ff375f'},
    {id:'salidas', n:'Salidas', e:'🎉', c:'#bf5af2'},
    {id:'ropa', n:'Ropa', e:'👕', c:'#64d2ff'},
    {id:'tecnologia', n:'Tecnología', e:'💻', c:'#30b0c7'},
    {id:'estudio', n:'Estudio', e:'📚', c:'#a2845e'},

  ],
  ingreso: [
    {id:'sueldo', n:'Sueldo', e:'💼', c:'#30d158'},
    {id:'ventas', n:'Ventas', e:'🏷️', c:'#0a84ff'},
    {id:'extra', n:'Trabajo extra', e:'🛠️', c:'#ff9f0a'},
    {id:'regalo', n:'Regalo', e:'🎁', c:'#ff375f'},
    {id:'inversion', n:'Inversión', e:'📈', c:'#5e5ce6'},
    {id:'cobro', n:'Cobro', e:'🤝', c:'#14c7a5'},
    {id:'otros_i', n:'Otros', e:'💰', c:'#ffcc00'},
  ],
};
const GOAL_EMOJIS = ['🎯','✈️','🏍️','🚗','📱','💻','🏠','🎓','💍','🎮','🏖️','🐶','👟','🎸','🛡️','💰'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MSHORT = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const WEEKDAYS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const CURRENCIES = [['L','Lempira (L)'],['$','Dólar ($)'],['€','Euro (€)'],['Q','Quetzal (Q)'],['₡','Colón (₡)'],['C$','Córdoba (C$)'],['MX$','Peso mexicano (MX$)']];

/* ---------- Estado ---------- */
const defaultState = () => ({
  v: 1,
  settings: { name: '', cur: 'L', theme: 'auto', pin: null, lastBackup: null },
  tx: [], debts: [], goals: [], budgets: {}, fixed: [],
});
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && d.v) return normalize(d);
  } catch (e) {}
  return defaultState();
}
function normalize(d) {
  const base = defaultState();
  return {
    ...base, ...d,
    settings: { ...base.settings, ...(d.settings || {}) },
    tx: Array.isArray(d.tx) ? d.tx : [],
    debts: Array.isArray(d.debts) ? d.debts.map(x => ({ payments: [], ...x })) : [],
    goals: Array.isArray(d.goals) ? d.goals.map(x => ({ history: [], ...x })) : [],
    budgets: d.budgets && typeof d.budgets === 'object' ? d.budgets : {},
    fixed: Array.isArray(d.fixed) ? d.fixed : [],
  };
}
let S = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('No se pudo guardar 😕'); }
}
const UI = { tab: 'inicio', month: null, txFilter: 'todos', q: '', debtDir: 'me', showClosed: false, sub: null };

/* ---------- Utilidades ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const toStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => toStr(new Date());
const ym = s => s.slice(0, 7);
const dt = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const daysBetween = (a, b) => Math.round((dt(b) - dt(a)) / 864e5);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const monthLabel = k => cap(MONTHS[+k.slice(5) - 1]) + ' ' + k.slice(0, 4);
function shiftMonth(k, d) {
  let y = +k.slice(0, 4), m = +k.slice(5) + d;
  while (m < 1) { m += 12; y--; }
  while (m > 12) { m -= 12; y++; }
  return `${y}-${pad(m)}`;
}
const nf = new Intl.NumberFormat('es-HN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = n => (n < -0.004 ? '-' : '') + S.settings.cur + ' ' + nf.format(Math.abs(n));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseAmt(v) {
  v = String(v || '').replace(/[^\d.,]/g, '');
  if (v.includes(',') && !v.includes('.') && /,\d{1,2}$/.test(v)) v = v.replace(',', '.');
  else v = v.replace(/,/g, '');
  const n = parseFloat(v);
  return isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : 0;
}
function relDate(s) {
  const t = todayStr(), diff = daysBetween(s, t);
  if (diff === 0) return 'Hoy';
  if (diff === 1) return 'Ayer';
  const d = dt(s);
  return `${d.getDate()} ${MSHORT[d.getMonth()]}` + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
}
function dayHead(s) {
  const diff = daysBetween(s, todayStr());
  if (diff === 0) return 'Hoy';
  if (diff === 1) return 'Ayer';
  const d = dt(s);
  return `${WEEKDAYS[d.getDay()]} ${d.getDate()} de ${MONTHS[d.getMonth()]}`;
}
function sinceText(s) {
  const n = daysBetween(s, todayStr());
  if (n <= 0) return 'hoy';
  if (n === 1) return 'hace 1 día';
  if (n < 30) return `hace ${n} días`;
  const m = Math.floor(n / 30);
  return m === 1 ? 'hace 1 mes' : `hace ${m} meses`;
}
const catOf = (type, id) => CATS[type].find(c => c.id === id) || CATS[type][CATS[type].length - 1];
const catIco = c => `<span class="cat-ico" style="--c:${c.c}">${c.e}</span>`;
function avatarStyle(name) {
  let h = 0; for (const ch of name) h = (h * 31 + ch.codePointAt(0)) % 360;
  return `background:linear-gradient(140deg,hsl(${h} 85% 66%),hsl(${(h + 40) % 360} 75% 46%))`;
}
const initial = n => esc((n || '?').trim().charAt(0).toUpperCase() || '?');
const sortTx = l => [...l].sort((a, b) => b.date.localeCompare(a.date) || (b.ts || 0) - (a.ts || 0));
const monthTx = k => S.tx.filter(t => ym(t.date) === k);
function sums(l) { let i = 0, g = 0; for (const t of l) t.type === 'ingreso' ? i += t.amount : g += t.amount; return { i, g }; }
const paid = d => d.payments.reduce((a, p) => a + p.amount, 0);
const remaining = d => Math.max(0, Math.round((d.amount - paid(d)) * 100) / 100);
const isStandalone = () => navigator.standalone || matchMedia('(display-mode: standalone)').matches;
function hashPin(p) { let h = 5381; for (const c of 'aqua·' + p) h = ((h * 33) ^ c.charCodeAt(0)) >>> 0; return h.toString(36); }

/* ---------- Componentes ---------- */
function seg(name, opts, val) {
  return `<div class="seg" data-seg="${name}">${opts.map(([v, l]) =>
    `<button type="button" data-v="${v}" class="${v === val ? 'on' : ''}">${l}</button>`).join('')}<i class="thumb"></i></div>`;
}
function layoutSegs(root = document) {
  $$('.seg', root).forEach(s => {
    const b = s.querySelector('button.on') || s.querySelector('button');
    const th = s.querySelector('.thumb');
    if (!b || !th || !b.offsetWidth) return;
    if (!s.dataset.ready) { th.style.transition = 'none'; }
    th.style.left = b.offsetLeft + 'px';
    th.style.width = b.offsetWidth + 'px';
    if (!s.dataset.ready) { th.offsetWidth; th.style.transition = ''; s.dataset.ready = 1; }
  });
}
function segSelect(btn) {
  const s = btn.closest('.seg');
  $$('button', s).forEach(b => b.classList.toggle('on', b === btn));
  layoutSegs(s.parentNode);
  return btn.dataset.v;
}
function bar(pct, cls = '') {
  const p = Math.max(0, Math.min(100, pct));
  return `<div class="bar ${cls}"><i data-w="${p.toFixed(1)}"></i></div>`;
}
function ring(pct, size = 54, stroke = 6, color = 'url(#rg)') {
  const r = (size - stroke) / 2, C = 2 * Math.PI * r, p = Math.max(0, Math.min(1, pct));
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ef0b8"/><stop offset="1" stop-color="#0a96ec"/></linearGradient></defs>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/>
    <circle class="p" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${C.toFixed(2)}" data-off="${(C * (1 - p)).toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
}
function empty(em, title, text) {
  return `<div class="glass empty"><span class="em">${em}</span><b>${title}</b>${text}</div>`;
}
function txRow(t, i = 0) {
  const c = catOf(t.type, t.cat), inc = t.type === 'ingreso';
  return `<button class="row tap" data-act="tx" data-id="${t.id}" style="--i:${i}">${catIco(c)}
    <div class="meta"><div class="t">${esc(t.note || c.n)}</div><div class="s">${c.n} · ${relDate(t.date)}</div></div>
    <div class="amt ${inc ? 'pos' : ''}">${inc ? '+' : '−'}${money(t.amount)}</div></button>`;
}
function countUp(root = document) {
  $$('[data-count]', root).forEach(el => {
    const to = +el.dataset.count; el.removeAttribute('data-count');
    if (reduceMotion || !to) { el.textContent = money(to); return; }
    const t0 = performance.now(), dur = 900;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4);
      el.textContent = money(to * e);
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
function postRender(root = document) {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $$('[data-w]', root).forEach(el => { el.style.width = el.dataset.w + '%'; el.removeAttribute('data-w'); });
    $$('[data-h]', root).forEach(el => { el.style.height = el.dataset.h + '%'; el.removeAttribute('data-h'); });
    $$('circle[data-len]', root).forEach(c => { c.setAttribute('stroke-dasharray', c.dataset.len + ' ' + c.dataset.rest); c.removeAttribute('data-len'); });
    $$('circle[data-off]', root).forEach(c => { c.setAttribute('stroke-dashoffset', c.dataset.off); c.removeAttribute('data-off'); });
    layoutSegs(root);
    countUp(root);
  }));
}

/* ---------- Render principal ---------- */
function render(anim = false) {
  const v = $('#view');
  const views = { inicio: vInicio, movs: vMovs, deudas: vDeudas, mas: vMas };
  v.innerHTML = views[UI.tab]();
  if (anim) { v.classList.remove('view-anim'); v.offsetWidth; v.classList.add('view-anim'); }
  $$('.tab').forEach(t => t.classList.toggle('on', t.dataset.id === UI.tab));
  if (UI.tab === 'movs') renderMovList();
  if (UI.tab === 'deudas') renderDebtList();

}

/* ===== Inicio ===== */
function vInicio() {
  const m = UI.month, list = monthTx(m), { i, g } = sums(list), bal = i - g;
  const owed = S.debts.filter(d => d.dir === 'me' && !d.closed).reduce((a, d) => a + remaining(d), 0);
  const owe = S.debts.filter(d => d.dir === 'yo' && !d.closed).reduce((a, d) => a + remaining(d), 0);
  const hr = new Date().getHours();
  const greet = hr < 12 ? 'Buenos días ☀️' : hr < 19 ? 'Buenas tardes 🌤️' : 'Buenas noches 🌙';
  const name = S.settings.name;
  let h = `<header class="top"><div class="hello"><small>${greet}</small><h1>${name ? esc(name) : 'Mis finanzas'}</h1></div>
    <button class="avatar tap" data-act="tab" data-id="mas">${name ? initial(name) : '💧'}</button></header>`;

  if (!isStandalone() && !localStorage.getItem('aqua-hint-off')) {
    h += `<div class="glass banner"><span style="font-size:26px">📲</span><div style="flex:1">Instalala en tu iPhone: tocá <b>Compartir</b> y luego <b>“Agregar a pantalla de inicio”</b>.</div><button class="x" data-act="hint-off">✕</button></div>`;
  }

  h += `<section class="hero">
    <div class="hero-top"><span class="label">Balance del mes</span>
      <div class="mnav"><button data-act="month" data-d="-1">‹</button><span>${cap(MSHORT[+m.slice(5) - 1])} ${m.slice(0, 4)}</span><button data-act="month" data-d="1">›</button></div></div>
    <div class="big" data-count="${bal}">${money(bal)}</div>
    <div class="pills"><div class="pill"><small>↓ Entró</small><b data-count="${i}">${money(i)}</b></div>
      <div class="pill"><small>↑ Salió</small><b data-count="${g}">${money(g)}</b></div></div></section>`;

  h += `<div class="grid2">
    <button class="glass mini tap" data-act="go-debts" data-id="me"><span class="mini-ico" style="--c:#14c78a">🤝</span><small>Te deben</small><b class="pos" data-count="${owed}">${money(owed)}</b></button>
    <button class="glass mini tap" data-act="go-debts" data-id="yo"><span class="mini-ico" style="--c:#ff7a45">💸</span><small>Debés</small><b class="neg" data-count="${owe}">${money(owe)}</b></button></div>`;

  h += alertsBlock();

  h += `<div class="sec"><h3>¿En qué se va?</h3></div>` + donut(list);
  h += barsBlock();

  if (S.goals.length) {
    h += `<div class="sec"><h3>Metas</h3><button data-act="sub" data-id="metas">Ver todas</button></div><div class="goals-row stagger">` +
      S.goals.map((gl, k) => `<button class="glass gmini tap" data-act="goal" data-id="${gl.id}" style="--i:${k}">
        <div class="rw">${ring(gl.saved / gl.target)}<span>${gl.emoji}</span></div>
        <b>${esc(gl.name)}</b><small>${Math.floor(Math.min(1, gl.saved / gl.target) * 100)}% · ${money(gl.saved)}</small></button>`).join('') + `</div>`;
  }

  const recent = sortTx(S.tx).slice(0, 6);
  h += `<div class="sec"><h3>Recientes</h3>${S.tx.length ? '<button data-act="tab" data-id="movs">Ver todo</button>' : ''}</div>`;

    : empty('🫧', '¡Empecemos!', 'Tocá el botón <b>+</b> para anotar tu primer gasto o ingreso.');
  return h;
}

function alertsBlock() {
  const cur = ym(todayStr()), today = new Date().getDate();
  const rows = [];
  S.fixed.forEach(f => {
    if (f.lastPaid === cur) return;
    const diff = f.day - today;
    if (diff > 5) return;
    const chip = diff < 0 ? `<span class="chip bad">Vencido</span>` : diff === 0 ? `<span class="chip warn">Hoy</span>` : `<span class="chip warn">En ${diff} día${diff > 1 ? 's' : ''}</span>`;
    rows.push(`<div class="alert-row">${catIco(catOf('gasto', f.cat))}<div class="meta"><div class="t">${esc(f.name)}</div><div class="s">${money(f.amount)} · día ${f.day}</div></div>${chip}<button class="chip go" data-act="pay-fixed" data-id="${f.id}">Pagar</button></div>`);
  });
  const spent = spentByCat(cur);
  Object.entries(S.budgets).forEach(([cat, lim]) => {
    if (!lim) return;
    const s = spent[cat] || 0, p = s / lim;
    if (p < 0.8) return;
    const c = catOf('gasto', cat);
    rows.push(`<div class="alert-row">${catIco(c)}<div class="meta"><div class="t">Presupuesto de ${c.n}</div><div class="s">${money(s)} de ${money(lim)}</div></div><span class="chip ${p >= 1 ? 'bad' : 'warn'}">${p >= 1 ? 'Te pasaste' : Math.round(p * 100) + '%'}</span></div>`);
  });
  if (!rows.length) return '';
  return `<div class="sec"><h3>Pendientes</h3></div><div class="glass list">${rows.join('')}</div>`;
}
function spentByCat(k) {
  const by = {};
  monthTx(k).filter(t => t.type === 'gasto').forEach(t => by[t.cat] = (by[t.cat] || 0) + t.amount);
  return by;
}
function donut(list) {
  const by = spentByCat(UI.month);
  const total = Object.values(by).reduce((a, b) => a + b, 0);
  if (!total) return `<div class="glass card muted" style="text-align:center;padding:24px">Sin gastos en ${MONTHS[+UI.month.slice(5) - 1]} todavía ✨</div>`;
  const rows = Object.entries(by).map(([id, v]) => ({ c: catOf('gasto', id), v })).sort((a, b) => b.v - a.v);
  const r = 48, C = 2 * Math.PI * r; let off = 0;
  const segs = rows.map(x => {
    const len = x.v / total * C, gap = rows.length > 1 ? Math.min(2.2, len * 0.35) : 0;
    const s = `<circle class="s" r="${r}" cx="60" cy="60" fill="none" stroke="${x.c.c}" stroke-width="15" stroke-dasharray="0 ${C.toFixed(2)}" data-len="${(len - gap).toFixed(2)}" data-rest="${(C - len + gap).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`;
    off += len; return s;
  }).join('');
  const shown = rows.slice(0, 5), rest = rows.slice(5).reduce((a, x) => a + x.v, 0);
  return `<div class="glass card donut-card"><div class="donut"><svg viewBox="0 0 120 120">
      <circle r="${r}" cx="60" cy="60" fill="none" stroke="var(--track)" stroke-width="15"/><g transform="rotate(-90 60 60)">${segs}</g></svg>
      <div class="donut-center"><small>Gastado</small><b>${money(total)}</b></div></div>
    <div class="legend">${shown.map(x => `<div class="lg"><i style="background:${x.c.c}"></i><span>${x.c.e} ${x.c.n}</span><b>${Math.round(x.v / total * 100)}%</b></div>`).join('')}
    ${rest ? `<div class="lg"><i style="background:#8e8e93"></i><span>Lo demás</span><b>${Math.round(rest / total * 100)}%</b></div>` : ''}</div></div>`;
}
function barsBlock() {
  const ms = []; for (let k = 5; k >= 0; k--) ms.push(shiftMonth(UI.month, -k));
  const data = ms.map(m => ({ m, ...sums(monthTx(m)) }));
  if (data.every(d => !d.i && !d.g)) return '';
  const max = Math.max(1, ...data.flatMap(d => [d.i, d.g]));
  const h = v => v ? Math.max(3, v / max * 100).toFixed(1) : 0;
  return `<div class="sec"><h3>Últimos 6 meses</h3></div><div class="glass card"><div class="bars">${data.map(d =>
    `<div class="bcol ${d.m === UI.month ? 'cur' : ''}"><div class="bpair"><i class="bi" data-h="${h(d.i)}"></i><i class="bg" data-h="${h(d.g)}"></i></div><span>${MSHORT[+d.m.slice(5) - 1]}</span></div>`).join('')}</div>
    <div class="blegend"><span><i class="bi"></i>Ingresos</span><span><i class="bg"></i>Gastos</span></div></div>`;
}

function debtCard(d, i) {

(() => { // deslizar para cerrar
  let y0 = null, dy = 0;
  sheetEl.addEventListener('touchstart', e => {
    if (sheetEl.scrollTop > 0 || e.target.closest('input,textarea,.cats,.emojis')) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0;
  }, { passive: true });
  sheetEl.addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy > 0) { sheetEl.classList.add('dragging'); sheetEl.style.transform = `translate(-50%,${dy}px)`; }
  }, { passive: true });
  sheetEl.addEventListener('touchend', () => {

async function exportData() {

  const file = new File([JSON.stringify(S)], name, { type: 'application/json' });
  const done = () => { S.settings.lastBackup = todayStr(); save(); closeSheet(); render(); toast('Respaldo listo 💾'); };
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Respaldo Aqua Finanzas' }); return done(); }
  } catch (e) { if (e.name === 'AbortError') return; }
  const url = URL.createObjectURL(file), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  done();
}

  r.onload = async () => {
    let d; try { d = JSON.parse(r.result); } catch (e) { return toast('Ese archivo no sirve 😕'); }
    if (!d || !d.v || !Array.isArray(d.tx)) return toast('Ese archivo no es un respaldo de Aqua');
    const ok = await confirmDialog('¿Restaurar respaldo?', `Se reemplazarán tus datos actuales por los del archivo (${d.tx.length} movimientos).`, 'Restaurar', true);
    if (!ok) return;
    S = normalize(d); save(); applyTheme(); closeSheet(); render(true); toast('Datos restaurados ✓');
  };
  r.readAsText(file);
}
async function wipe() {
  if (!await confirmDialog('¿Borrar todo?', 'Se eliminarán todos tus movimientos, deudas, metas y ajustes de este teléfono.', 'Borrar', true)) return;
  if (!await confirmDialog('¿Seguro seguro?', 'No hay vuelta atrás. Si no tenés respaldo, se pierde todo.', 'Sí, borrar todo', true)) return;
  S = defaultState(); save(); applyTheme(); UI.sub = null; render(true); toast('Todo borrado');
}

/* ---------- Toast, diálogo, burbujas ---------- */
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200);
}
function confirmDialog(title, text, okLabel = 'Aceptar', danger = false) {
  return new Promise(res => {
    const w = document.createElement('div'); w.className = 'dialog-wrap';
    w.innerHTML = `<div class="dialog"><div class="bd"><h4>${title}</h4>${text ? `<p>${text}</p>` : ''}</div>
      <div class="bt"><button data-r="0">Cancelar</button><button data-r="1" class="${danger ? 'danger' : 'strong'}">${okLabel}</button></div></div>`;
    document.body.appendChild(w); requestAnimationFrame(() => w.classList.add('on'));
    w.onclick = e => {
      const b = e.target.closest('[data-r]'); if (!b && e.target !== w) return;
      w.classList.remove('on'); setTimeout(() => w.remove(), 250); res(b ? b.dataset.r === '1' : false);
    };
  });
}
function burst() {
  if (reduceMotion) return;
  const cx = innerWidth / 2, cy = innerHeight / 2.4;
  for (let i = 0; i < 26; i++) {
    const b = document.createElement('span'), s = 10 + Math.random() * 26, a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 220;
    b.className = 'burst';
    b.style.cssText = `width:${s}px;height:${s}px;left:${cx - s / 2}px;top:${cy - s / 2}px;--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - 80}px;animation-delay:${Math.random() * 120}ms`;
    document.body.appendChild(b); setTimeout(() => b.remove(), 1600);
  }
}
function makeBubbles() {
  if (reduceMotion) return;
  const sky = $('.sky');
  for (let i = 0; i < 14; i++) {
    const b = document.createElement('span'), s = 14 + Math.random() * 64;
    b.className = 'bubble';
    b.style.cssText = `width:${s}px;height:${s}px;left:${Math.random() * 100}%;animation-duration:${16 + Math.random() * 22}s;animation-delay:${-Math.random() * 30}s;opacity:${0.5 + Math.random() * 0.5}`;
    sky.appendChild(b);
  }
}

/* ---------- PIN ---------- */
let lockedAt = null;
function showLock() {
  if (!S.settings.pin) return;
  const L = $('#lock'); let entry = '';
  L.classList.remove('out');
  L.innerHTML = `<div class="avatar" style="width:64px;height:64px;font-size:28px">💧</div><h2>Ingresá tu PIN</h2>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join('')}<button class="blank"></button><button data-k="0">0</button><button class="del" data-k="del">⌫</button></div>`;
  L.classList.add('on');
  const paint = () => $$('#dots i').forEach((d, i) => d.classList.toggle('f', i < entry.length));
  L.onclick = e => {
    const k = e.target.closest('[data-k]'); if (!k) return;
    if (k.dataset.k === 'del') entry = entry.slice(0, -1);
    else if (entry.length < 4) entry += k.dataset.k;
    paint();
    if (entry.length === 4) {
      if (hashPin(entry) === S.settings.pin) {
        L.classList.add('out'); setTimeout(() => L.classList.remove('on', 'out'), 400);
      } else { shake($('#dots')); setTimeout(() => { entry = ''; paint(); }, 400); }
    }
  };
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) lockedAt = Date.now();
  else if (S.settings.pin && lockedAt && Date.now() - lockedAt > 60000) showLock();
});

/* ---------- Acciones globales ---------- */
const ACTIONS = {
  tab: id => { const same = UI.tab === id; UI.tab = id; if (id === 'mas') UI.sub = null; if (id !== 'movs') UI.q = ''; render(!same || id === 'mas'); scrollTo({ top: 0, behavior: same ? 'smooth' : 'instant' }); },
  add: () => UI.tab === 'deudas' ? openDebtForm(null, UI.debtDir) : openTxSheet(null, 'gasto'),
  close: closeSheet,
  month: (id, el) => { UI.month = shiftMonth(UI.month, +el.dataset.d); render(); },
  tx: id => { const t = S.tx.find(x => x.id === id); if (t) openTxSheet(t); },
  debt: id => { const d = S.debts.find(x => x.id === id); if (d) openDebtSheet(d); },
  'new-debt': () => openDebtForm(null, UI.debtDir),
  'go-debts': id => { UI.tab = 'deudas'; UI.debtDir = id; render(true); scrollTo(0, 0); },
  'toggle-closed': () => { UI.showClosed = !UI.showClosed; renderDebtList(); postRender($('#debtlist')); },
  sub: id => { UI.tab = 'mas'; UI.sub = id; render(); scrollTo(0, 0); },
  'sub-metas': () => ACTIONS.sub('metas'),
  'sub-presupuestos': () => ACTIONS.sub('presupuestos'),
  'sub-fijos': () => ACTIONS.sub('fijos'),
  back: () => { UI.sub = null; render(true); scrollTo(0, 0); },
  goal: id => { const g = S.goals.find(x => x.id === id); if (g) openGoalSheet(g); },
  'new-goal': () => openGoalForm(null),
  'new-fixed': () => openFixedForm(null),
  'edit-fixed': id => { const f = S.fixed.find(x => x.id === id); if (f) openFixedForm(f); },
  'pay-fixed': id => payFixed(id),
  'set-name': openNameSheet,
  'set-theme': () => openOptions('Apariencia', [['auto', '✨ Automático (según el iPhone)'], ['light', '☀️ Claro'], ['dark', '🌙 Oscuro']], S.settings.theme, v => { S.settings.theme = v; save(); applyTheme(); }),
  'set-cur': () => openOptions('Moneda', CURRENCIES, S.settings.cur, v => { S.settings.cur = v; save(); }),
  'set-pin': openPinSheet,
  backup: openBackupSheet,
  wipe,
  'hint-off': () => { try { localStorage.setItem('aqua-hint-off', '1'); } catch (e) {} render(); },
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a && ACTIONS[a.dataset.act]) { e.preventDefault(); ACTIONS[a.dataset.act](a.dataset.id, a, e); return; }
  const sb = e.target.closest('#view .seg button');
  if (sb) {
    const name = sb.closest('.seg').dataset.seg, v = segSelect(sb);
    if (name === 'txf') { UI.txFilter = v; renderMovList(); postRender($('#movlist')); }
    if (name === 'dd') { UI.debtDir = v; renderDebtList(); postRender($('#debtlist')); }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'amt') fitAmt(e.target);
  if (e.target.id === 'q') { UI.q = e.target.value; renderMovList(); postRender($('#movlist')); }
});
document.addEventListener('change', e => {
  const c = e.target.dataset && e.target.dataset.budget;
  if (c) {
    const v = parseAmt(e.target.value);
    if (v) S.budgets[c] = v; else delete S.budgets[c];
    save(); render();
  }
});
addEventListener('resize', () => layoutSegs());
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);

/* ---------- Inicio ---------- */
UI.month = ym(todayStr());
applyTheme();
makeBubbles();
render(true);
showLock();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
