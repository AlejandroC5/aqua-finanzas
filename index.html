<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aqua">
<meta name="theme-color" content="#a9dcff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Aqua Finanzas</title>
<style>
:root{
  --sky-a:#9fd8ff; --sky-b:#dcf2ff; --sky-c:#e6fff1;
  --glow:rgba(255,255,255,.95);
  --text:#0b1a2a; --muted:#57697c; --faint:#8b9bab;
  --glass:rgba(255,255,255,.6); --glass-strong:rgba(250,253,255,.86);
  --glass-border:rgba(255,255,255,.95); --hair:rgba(10,40,70,.08);
  --track:rgba(110,140,170,.17);
  --shadow:0 14px 34px -16px rgba(20,90,160,.42), 0 2px 6px rgba(20,90,160,.06);
  --inner:inset 0 1px 0 rgba(255,255,255,.95);
  --aqua:#0a8fe6; --teal:#14c7a5; --pos:#11a04e; --neg:#e3323e; --warn:#e98300;
  --bubble:rgba(255,255,255,.5); --cloud:rgba(255,255,255,.75);
  --wave1:rgba(120,215,255,.35); --wave2:rgba(90,230,190,.3);
  --thumb:rgba(255,255,255,.98);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky-a:#020f1e; --sky-b:#06243f; --sky-c:#042a26;
    --glow:rgba(50,160,255,.2);
    --text:#eaf5ff; --muted:#9db3c8; --faint:#6a8197;
    --glass:rgba(16,36,60,.58); --glass-strong:rgba(20,42,68,.92);
    --glass-border:rgba(150,210,255,.14); --hair:rgba(160,210,255,.09);
    --track:rgba(160,200,240,.11);
    --shadow:0 16px 36px -16px rgba(0,0,0,.75), 0 2px 6px rgba(0,0,0,.3);
    --inner:inset 0 1px 0 rgba(255,255,255,.08);
    --pos:#3ddc84; --neg:#ff6b74; --warn:#ffb340;
    --bubble:rgba(130,210,255,.14); --cloud:rgba(110,170,230,.08);
    --wave1:rgba(30,140,220,.22); --wave2:rgba(20,180,150,.16);
    --thumb:rgba(255,255,255,.16);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky-a:#020f1e; --sky-b:#06243f; --sky-c:#042a26;
  --glow:rgba(50,160,255,.2);
  --text:#eaf5ff; --muted:#9db3c8; --faint:#6a8197;
  --glass:rgba(16,36,60,.58); --glass-strong:rgba(20,42,68,.92);
  --glass-border:rgba(150,210,255,.14); --hair:rgba(160,210,255,.09);
  --track:rgba(160,200,240,.11);
  --shadow:0 16px 36px -16px rgba(0,0,0,.75), 0 2px 6px rgba(0,0,0,.3);
  --inner:inset 0 1px 0 rgba(255,255,255,.08);
  --pos:#3ddc84; --neg:#ff6b74; --warn:#ffb340;
  --bubble:rgba(130,210,255,.14); --cloud:rgba(110,170,230,.08);
  --wave1:rgba(30,140,220,.22); --wave2:rgba(20,180,150,.16);
  --thumb:rgba(255,255,255,.16);
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);color:var(--text);background:var(--sky-b);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none;letter-spacing:-.005em}
body.noscroll{overflow:hidden}
input,textarea{-webkit-user-select:text;user-select:text}
button{font-family:inherit;color:inherit;cursor:pointer}
.num{font-family:var(--round);font-variant-numeric:tabular-nums}

/* ============ Escenario Frutiger Aero ============ */
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:
    radial-gradient(120% 50% at 20% -8%,var(--glow),transparent 60%),
    radial-gradient(70% 45% at 105% 30%,rgba(90,205,255,.32),transparent 70%),
    radial-gradient(90% 50% at -5% 95%,rgba(90,235,180,.32),transparent 70%),
    linear-gradient(180deg,var(--sky-a),var(--sky-b) 52%,var(--sky-c))}
.aurora{position:absolute;width:150vmax;height:150vmax;left:-25vmax;top:-72vmax;
  background:conic-gradient(from 0deg,rgba(54,198,255,.24),rgba(20,199,165,.18),rgba(139,92,246,.12),rgba(54,198,255,.24));
  filter:blur(70px);animation:spin 60s linear infinite;opacity:.85}
.cloud{position:absolute;border-radius:50%;background:var(--cloud);filter:blur(28px);animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.bubble{position:absolute;bottom:-140px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 7%,rgba(255,255,255,.35) 17%,var(--bubble) 45%,rgba(255,255,255,.06) 72%);
  box-shadow:inset -5px -8px 16px rgba(255,255,255,.2),inset 3px 5px 9px rgba(255,255,255,.32),0 0 0 1px rgba(255,255,255,.28);
  animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0)}50%{transform:translate(24px,-60vh)}100%{transform:translate(-14px,-125vh)}}
@keyframes spin{to{transform:rotate(360deg)}}
.waves{position:absolute;left:0;right:0;bottom:0;height:150px;overflow:hidden}
.waves svg{position:absolute;bottom:0;width:200%;height:100%;left:0}
.waves .w1{animation:wave 14s linear infinite;fill:var(--wave1)}
.waves .w2{animation:wave 9s linear infinite reverse;fill:var(--wave2);height:75%}
@keyframes wave{to{transform:translateX(-50%)}}

/* ============ Layout ============ */
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 124px)}
.view-anim{animation:viewIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px) scale(.99)}}
.stagger>*{animation:itemIn .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 38ms)}
@keyframes itemIn{from{opacity:0;transform:translateY(12px)}}

.navbar{position:fixed;z-index:30;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;text-align:center;font-weight:700;font-size:17px;
  background:var(--glass-strong);-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);
  border-bottom:1px solid var(--hair);opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .25s,transform .25s}
.navbar.show{opacity:1;transform:none}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 18px}
.hello small{display:block;color:var(--muted);font-size:13px;font-weight:600}
.hello h1,.large h1{margin:2px 0 0;font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.large{display:flex;align-items:center;justify-content:space-between;margin:6px 0 16px;min-height:46px;gap:10px}
.large h1{margin:0}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass);display:grid;place-items:center;font-size:18px;
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:var(--shadow),var(--inner)}
.icon-btn svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.avatar{width:42px;height:42px;border-radius:50%;border:0;display:grid;place-items:center;flex:none;font-size:18px;font-weight:800;color:#fff;position:relative;overflow:hidden;font-family:var(--round);
  background:radial-gradient(circle at 50% 30%,#8fe3ff,#18a8f5 50%,#0a6fd6);
  box-shadow:0 6px 16px -6px rgba(10,130,230,.8),inset 0 -3px 8px rgba(0,40,120,.35),inset 0 1px 1px rgba(255,255,255,.8)}
.gloss::before,.avatar::before,.fab::before,.btn::before,.mini-ico::before,.cat-ico::before,.set-ico::before,.av::before,.dk-ico::before,.wr::before{
  content:"";position:absolute;left:8%;right:8%;top:3%;height:48%;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;
  background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.06));pointer-events:none}

.glass{background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 40%),var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(185%);backdrop-filter:blur(24px) saturate(185%);
  border:1px solid var(--glass-border);box-shadow:var(--shadow),var(--inner);border-radius:24px}
.card{padding:16px;margin-bottom:14px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 2px 10px}
.sec h3{margin:0;font-size:19px;font-weight:750;letter-spacing:-.02em}
.sec button{border:0;background:none;color:var(--aqua);font-weight:600;font-size:15px;padding:0}
.tap{transition:transform .2s cubic-bezier(.3,1.4,.5,1),opacity .2s}
.tap:active{transform:scale(.965);opacity:.85}
.pos{color:var(--pos)!important}.neg{color:var(--neg)!important}
.muted{color:var(--muted)}

/* ============ Ventana estilo Mac ============ */
.window{position:relative;overflow:hidden;border-radius:26px;color:#fff;margin-bottom:14px;
  background:linear-gradient(165deg,#43ccff 0%,#0a8de6 46%,#0a5cc4 100%);
  box-shadow:0 22px 44px -20px rgba(10,110,220,.9),inset 0 1px 0 rgba(255,255,255,.65),inset 0 -12px 30px rgba(0,30,100,.22)}
.window::before{content:"";position:absolute;left:-10%;right:-10%;top:-62%;height:100%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.03));pointer-events:none}
.window::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);animation:shine 7s ease-in-out 1.2s infinite;pointer-events:none}
@keyframes shine{0%,72%{left:-60%}100%{left:130%}}
.window.green{background:linear-gradient(165deg,#56e6bd 0%,#12ae7b 50%,#0a7a5c 100%);box-shadow:0 22px 44px -20px rgba(10,160,110,.9),inset 0 1px 0 rgba(255,255,255,.65),inset 0 -12px 30px rgba(0,60,40,.22)}
.window.orange{background:linear-gradient(165deg,#ffc76e 0%,#ff8a3d 50%,#e2503a 100%);box-shadow:0 22px 44px -20px rgba(230,100,50,.9),inset 0 1px 0 rgba(255,255,255,.65),inset 0 -12px 30px rgba(100,30,0,.22)}
.window.violet{background:linear-gradient(165deg,#b9a2ff 0%,#7b5cf0 50%,#4b34c4 100%);box-shadow:0 22px 44px -20px rgba(110,80,230,.9),inset 0 1px 0 rgba(255,255,255,.65),inset 0 -12px 30px rgba(30,0,100,.22)}
.titlebar{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:12px 14px 0}
.lights{display:flex;gap:7px;width:62px}
.lights i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 1px 1px rgba(255,255,255,.7),inset 0 -1px 2px rgba(0,0,0,.25),0 1px 2px rgba(0,0,0,.2)}
.lights .r{background:radial-gradient(circle at 50% 35%,#ff9a92,#ff5f57 60%,#d8382f)}
.lights .y{background:radial-gradient(circle at 50% 35%,#ffe08a,#febc2e 60%,#d99a0b)}
.lights .g{background:radial-gradient(circle at 50% 35%,#8ff09a,#28c840 60%,#14a02b)}
.wbody{position:relative;z-index:1;padding:14px 20px 18px}
.wbody .label{font-size:14px;font-weight:600;opacity:.9}
.wbody .big{font-family:var(--round);font-size:42px;font-weight:800;letter-spacing:-.035em;margin:2px 0 14px;font-variant-numeric:tabular-nums;text-shadow:0 2px 12px rgba(0,40,110,.22);word-break:break-all;line-height:1.15}
.wbody .sub{font-size:14px;opacity:.92;font-weight:600}
.pills{display:flex;gap:10px}
.pill{flex:1;min-width:0;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);border-radius:16px;padding:10px 12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.pill small{display:block;font-size:12px;font-weight:600;opacity:.88}
.pill b{display:block;font-size:16px;font-family:var(--round);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mnav{display:flex;align-items:center;gap:2px;font-size:13px;font-weight:700;background:rgba(0,30,80,.14);border-radius:14px;padding:2px;box-shadow:inset 0 1px 2px rgba(0,30,80,.2)}
.mnav button{border:0;background:none;color:inherit;width:26px;height:24px;font-size:17px;line-height:1;border-radius:12px}
.mnav button:active{background:rgba(255,255,255,.25)}
.mnav span{min-width:74px;text-align:center}
.wbtn{width:62px;display:flex;justify-content:flex-end}
.wbtn button{border:0;background:rgba(255,255,255,.18);color:#fff;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.wbtn svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ============ Mini cards / cuentas ============ */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{text-align:left;padding:14px;border-radius:22px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mini small{color:var(--muted);font-weight:600;font-size:13px;margin-top:8px}
.mini b{font-size:19px;font-weight:800;font-family:var(--round);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile{padding:12px;border-radius:20px;min-width:0}
.tile small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.25;min-height:29px}
.tile b{display:block;font-size:16px;font-family:var(--round);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-ico,.cat-ico,.set-ico,.av,.dk-ico{position:relative;overflow:hidden;display:grid;place-items:center;flex:none}
.mini-ico{width:36px;height:36px;border-radius:11px;font-size:19px;background:var(--c);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 45%,white),var(--c));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 5px 12px -5px var(--c)}
.cat-ico{width:42px;height:42px;border-radius:13px;font-size:21px;background:var(--c);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 40%,white),color-mix(in srgb,var(--c) 85%,black));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 5px 12px -6px var(--c);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.cat-ico.sm{width:34px;height:34px;font-size:17px;border-radius:11px}
.accs{display:flex;gap:10px;overflow-x:auto;margin:0 -18px;padding:4px 18px 6px;scrollbar-width:none;scroll-snap-type:x mandatory}
.accs::-webkit-scrollbar{display:none}
.acc{flex:0 0 auto;min-width:140px;scroll-snap-align:start;padding:12px 14px;border-radius:20px;text-align:left;display:flex;flex-direction:column;gap:6px}
.acc .h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.acc b{font-family:var(--round);font-size:17px;white-space:nowrap}
.acc.total{background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0)),linear-gradient(160deg,#5fe0b8,#14b07c);color:#fff;border-color:rgba(255,255,255,.5)}
.acc.total .h{color:rgba(255,255,255,.9)}
.acc.add{min-width:64px;align-items:center;justify-content:center;font-size:24px;color:var(--aqua)}

/* ============ Listas ============ */
.list{padding:4px 0;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;border:0;background:none;text-align:left;position:relative}
.list>.row+.row::before,.list>.lrow+.lrow::before{content:"";position:absolute;top:0;left:68px;right:0;height:1px;background:var(--hair)}
.lrow{position:relative}
.meta{flex:1;min-width:0}
.meta .t{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .s{font-size:13px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;font-family:var(--round);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:16px}
.chev{color:var(--faint);font-size:20px;margin-left:2px}
.dayhead{display:flex;justify-content:space-between;margin:18px 8px 8px;font-size:13px;font-weight:600;color:var(--muted)}
.dayhead span:first-child::first-letter{text-transform:uppercase}
.sumline{display:flex;gap:10px;margin:4px 0 0}
.sumline>div{flex:1;padding:12px 14px;border-radius:18px}
.sumline small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.sumline b{font-size:17px;font-family:var(--round)}
.empty{text-align:center;padding:34px 22px;color:var(--muted);line-height:1.45}
.empty .em{font-size:46px;display:block;margin-bottom:8px;animation:float 3s ease-in-out infinite}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
@keyframes float{50%{transform:translateY(-8px)}}

/* ============ Controles ============ */
.seg{display:flex;position:relative;background:var(--track);border-radius:12px;padding:2px;margin-bottom:12px;box-shadow:inset 0 1px 2px rgba(0,30,70,.08)}
.seg button{flex:1;position:relative;z-index:1;border:0;background:none;padding:7px 0;font-weight:600;font-size:14px;border-radius:10px}
.seg .thumb{position:absolute;top:2px;bottom:2px;left:2px;border-radius:10px;background:var(--thumb);box-shadow:0 3px 8px rgba(0,30,70,.14),0 0 0 .5px rgba(0,30,70,.06);
  transition:left .38s cubic-bezier(.3,1.25,.5,1),width .38s cubic-bezier(.3,1.25,.5,1)}
.search{display:flex;align-items:center;gap:8px;padding:0 14px;margin-bottom:12px;border-radius:14px}
.search svg{width:18px;height:18px;color:var(--faint);flex:none}
.search input{flex:1;border:0;background:none;outline:none;font:500 16px var(--font);color:var(--text);padding:11px 0;min-width:0}
.mbar{display:flex;align-items:center;justify-content:space-between;padding:5px;border-radius:16px;margin-bottom:12px}
.mbar b{font-size:16px}
.mbar button{width:38px;height:34px;border-radius:11px;border:0;background:none;font-size:22px;color:var(--aqua)}
.mbar button:active{background:var(--track)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chipsel{border:1px solid var(--hair);background:var(--glass);border-radius:20px;padding:8px 13px;font-size:14px;font-weight:600;transition:all .2s}
.chipsel.on{background:linear-gradient(180deg,#5fd3ff,#0a8fe6);color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 12px -5px rgba(10,140,230,.9)}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch i{position:absolute;inset:0;border-radius:20px;background:var(--track);transition:background .25s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.2);transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.switch input:checked+i{background:linear-gradient(180deg,#5cf0bf,#22c55e)}
.switch input:checked+i::after{transform:translateX(20px)}
.toggle-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;margin-bottom:12px;font-weight:600;font-size:15px}
.toggle-row span{flex:1}

/* ============ Gráficas ============ */
.donut-card{display:flex;align-items:center;gap:16px}
.donut{position:relative;width:132px;height:132px;flex:none}
.donut svg{width:100%;height:100%;overflow:visible}
.donut circle.s{transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1)}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 22px}
.donut-center small{font-size:11px;color:var(--muted);font-weight:600}
.donut-center b{font-size:14px;font-family:var(--round);word-break:break-all;line-height:1.15}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.lg{display:flex;align-items:center;gap:8px;font-size:14px}
.lg i{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:inset 0 1px 1px rgba(255,255,255,.6)}
.lg span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg b{font-family:var(--round);font-size:13px;color:var(--muted)}
.bars{display:flex;justify-content:space-between;align-items:flex-end;height:140px;gap:6px;padding-top:6px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.bpair{flex:1;display:flex;align-items:flex-end;gap:4px;width:100%;justify-content:center}
.bpair i{width:12px;height:0;border-radius:6px 6px 3px 3px;transition:height 1s cubic-bezier(.2,.8,.2,1);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
i.bi{background:linear-gradient(180deg,#5ef0b8,#12a96f)}
i.bg{background:linear-gradient(180deg,#6fd8ff,#0a86e0)}
.bcol span{font-size:12px;font-weight:600;color:var(--faint)}
.bcol.cur span{color:var(--aqua)}
.blegend{display:flex;gap:16px;justify-content:center;margin-top:12px;font-size:13px;color:var(--muted);font-weight:600}
.blegend span{display:flex;align-items:center;gap:6px}
.blegend i{width:10px;height:10px;border-radius:4px;display:inline-block}
.bar{height:8px;border-radius:6px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--teal),var(--aqua));box-shadow:inset 0 1px 0 rgba(255,255,255,.6);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bar.warn i{background:linear-gradient(90deg,#ffcc4d,#ff9500)}
.bar.over i{background:linear-gradient(90deg,#ff8a80,#ff3b47)}
.ring circle.p{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.goals-row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:4px 18px 14px;scrollbar-width:none}
.goals-row::-webkit-scrollbar{display:none}
.gmini{flex:0 0 148px;scroll-snap-align:start;padding:14px;border-radius:22px;text-align:left;display:flex;flex-direction:column;gap:6px}
.gmini .rw{position:relative;width:54px;height:54px}
.gmini .rw span{position:absolute;inset:0;display:grid;place-items:center;font-size:22px}
.gmini b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gmini small{font-size:12px;color:var(--muted);font-weight:600}

/* ============ Avisos ============ */
.alert-row{display:flex;align-items:center;gap:12px;padding:12px 14px}
.alert-row+.alert-row{border-top:1px solid var(--hair)}
.chip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:20px;white-space:nowrap;border:0}
.chip.ok{background:rgba(18,161,80,.14);color:var(--pos)}
.chip.warn{background:rgba(255,149,0,.16);color:var(--warn)}
.chip.bad{background:rgba(229,51,63,.14);color:var(--neg)}
.chip.go{background:linear-gradient(180deg,#5fd3ff,#0a8ee8);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 10px -4px rgba(10,140,230,.8)}
.chip.go.inc{background:linear-gradient(180deg,#5cf0bf,#14b57d);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 10px -4px rgba(10,160,100,.8)}
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.35}
.banner .x{flex:none}
.promo{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:14px;width:100%;text-align:left;color:#fff;border:0;border-radius:22px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#ff7eb3,#a46bff 50%,#4f8dff);box-shadow:0 16px 30px -16px rgba(140,80,255,.9),inset 0 1px 0 rgba(255,255,255,.6)}
.promo .em{font-size:30px}
.promo b{display:block;font-size:16px}
.promo small{font-size:13px;opacity:.9}

/* ============ Deudas ============ */
.dcard{width:100%;text-align:left;padding:14px;border-radius:22px;margin-bottom:10px;display:block}
.dcard .top-r{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.av{width:44px;height:44px;border-radius:50%;color:#fff;font-weight:800;font-size:18px;font-family:var(--round);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 5px 12px -6px rgba(0,0,0,.4);text-shadow:0 1px 2px rgba(0,0,0,.2)}
.av.xl{width:76px;height:76px;font-size:32px;margin:0 auto 10px}
.dcard.closed{opacity:.6}
.toggle-link{display:block;margin:14px auto;border:0;background:none;color:var(--aqua);font-weight:600;font-size:15px}

/* ============ Ajustes ============ */
.group{margin-bottom:18px;overflow:hidden}
.set{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;border:0;background:none;text-align:left;font-size:16px;position:relative}
.group>.set+.set::before{content:"";position:absolute;top:0;left:57px;right:0;height:1px;background:var(--hair)}
.set .lbl{flex:1;font-weight:500}
.set .val{color:var(--muted);font-size:15px;font-family:var(--round)}
.set-ico{width:30px;height:30px;border-radius:8px;font-size:16px;background:var(--c);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 50%,white),var(--c));box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.set.danger .lbl{color:var(--neg)}
.group-title{font-size:13px;color:var(--muted);font-weight:600;margin:0 14px 6px;text-transform:uppercase;letter-spacing:.03em}
.profile{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:18px;width:100%;text-align:left}
.profile .avatar{width:58px;height:58px;font-size:25px}
.profile b{font-size:20px;display:block}
.foot{text-align:center;color:var(--faint);font-size:13px;line-height:1.5;margin:22px 10px}
.back{display:flex;align-items:center;gap:2px;border:0;background:none;color:var(--aqua);font-size:17px;font-weight:500;padding:6px 0;margin:0 0 2px -4px}
.back span{font-size:26px;line-height:1;margin-top:-3px}
.slide-in{animation:slideIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}}
.budget-row{padding:12px 14px}
.budget-row+.budget-row{border-top:1px solid var(--hair)}
.budget-row .hd{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.budget-row input{width:110px;text-align:right;padding:9px 10px;font-size:16px;min-height:40px}
.hint{font-size:13.5px;color:var(--muted);margin:0 6px 14px;line-height:1.45}

/* ============ Botones Aqua ============ */
.btn{position:relative;overflow:hidden;border:0;border-radius:999px;padding:15px 20px;width:100%;font-weight:700;font-size:17px;color:#fff;
  background:linear-gradient(180deg,#6ad8ff 0%,#1aa2f0 48%,#0a84e2 52%,#0a6fd2 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 8px rgba(0,50,140,.25),0 12px 24px -12px rgba(10,120,220,.9),0 0 0 .5px rgba(0,60,140,.3);
  text-shadow:0 1px 1px rgba(0,40,110,.25);transition:transform .18s cubic-bezier(.3,1.4,.5,1),filter .2s}
.btn:active{transform:scale(.97);filter:brightness(1.06)}
.btn::before{top:2px;left:5%;right:5%;height:46%;border-radius:999px 999px 40% 40%}
.btn.green{background:linear-gradient(180deg,#7cf5c9 0%,#1ec488 48%,#12aa72 52%,#0b8e62 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 8px rgba(0,80,50,.25),0 12px 24px -12px rgba(10,150,100,.9),0 0 0 .5px rgba(0,90,60,.3)}
.btn.red{background:linear-gradient(180deg,#ff9d9d 0%,#f4525c 48%,#e23a46 52%,#c92735 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 8px rgba(120,0,20,.25),0 12px 24px -12px rgba(200,40,50,.9)}
.btn.wa{background:linear-gradient(180deg,#86f7aa 0%,#2fd96c 48%,#22c55e 52%,#14a84c 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 8px rgba(0,80,30,.25),0 12px 24px -12px rgba(20,170,80,.9)}
.btn.violet{background:linear-gradient(180deg,#c6b3ff 0%,#8b6cf6 48%,#7a5cf0 52%,#5b3fd6 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 8px rgba(40,0,120,.25),0 12px 24px -12px rgba(110,80,230,.9)}
.btn.ghost{background:var(--glass-strong);color:var(--aqua);box-shadow:inset 0 0 0 1px var(--hair),0 6px 16px -10px rgba(0,40,90,.35);text-shadow:none}
.btn.ghost::before{display:none}
.btn.ghost.danger{color:var(--neg)}
.btn.sm{width:auto;padding:8px 16px;font-size:15px}
.btn-row{display:flex;gap:10px;margin-top:10px}
.btn-row .btn{flex:1}

/* ============ Dock ============ */
.dock{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px);
  display:flex;align-items:flex-end;gap:10px;padding:8px 12px 10px;border-radius:26px;
  background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.08)),var(--glass);
  -webkit-backdrop-filter:blur(26px) saturate(200%);backdrop-filter:blur(26px) saturate(200%);
  border:1px solid var(--glass-border);box-shadow:0 20px 40px -14px rgba(0,40,90,.5),var(--inner)}
.dk{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.dk-ico{width:48px;height:48px;border-radius:14px;background:linear-gradient(180deg,var(--c1),var(--c2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -2px 6px rgba(0,0,0,.18),0 6px 14px -6px var(--c2)}
.dk-ico svg{width:25px;height:25px;fill:none;stroke:#fff;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;position:relative;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.dk .dot{width:5px;height:5px;border-radius:50%;background:var(--text);opacity:0;transform:scale(.3);transition:all .3s}
.dk.on{transform:translateY(-4px)}
.dk.on .dot{opacity:.75;transform:none}
.dk:active{transform:scale(.88)}
.dk.on .dk-ico{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{40%{transform:scale(1.18)}}
.fab{position:relative;overflow:hidden;width:58px;height:58px;border-radius:50%;border:0;margin:-14px 2px 4px;flex:none;color:#fff;
  background:radial-gradient(circle at 50% 30%,#a5ecff,#18a8f5 48%,#0a62cc);
  box-shadow:0 12px 24px -8px rgba(10,130,230,.9),inset 0 -5px 12px rgba(0,40,120,.4),inset 0 2px 2px rgba(255,255,255,.85);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.fab:active{transform:scale(.88)}
.fab svg{width:28px;height:28px;stroke:#fff;stroke-width:2.8;stroke-linecap:round;fill:none;position:relative;filter:drop-shadow(0 1px 2px rgba(0,40,120,.4))}
.fab::before{left:16%;right:16%;top:4%;height:44%}

/* ============ Hoja inferior ============ */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(3,20,40,.36);opacity:0;pointer-events:none;transition:opacity .35s;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:51;left:50%;bottom:0;width:min(560px,100%);max-height:92vh;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  transform:translate(-50%,110%);transition:transform .5s cubic-bezier(.2,.9,.25,1);
  border-radius:30px 30px 0 0;padding:6px 18px calc(env(safe-area-inset-bottom) + 22px);
  background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);
  border:1px solid var(--glass-border);border-bottom:0;box-shadow:0 -20px 50px -20px rgba(0,30,70,.45),var(--inner)}
.sheet.open{transform:translate(-50%,0)}
.sheet.dragging{transition:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--faint);opacity:.45;margin:6px auto 12px}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sh-head h2{margin:0;font-size:22px;font-weight:750;letter-spacing:-.02em}
.x{width:30px;height:30px;border-radius:50%;border:0;background:var(--track);color:var(--muted);font-size:14px;font-weight:800}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:0 4px 6px}
.input{width:100%;font:500 16px var(--font);color:var(--text);background:var(--glass);border:1px solid var(--hair);border-radius:14px;padding:12px 14px;outline:none;transition:box-shadow .2s,border-color .2s;-webkit-appearance:none;appearance:none;min-height:48px}
.input:focus{box-shadow:0 0 0 4px rgba(10,150,236,.2);border-color:var(--aqua)}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amount-wrap{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:4px 0 16px;padding:8px 0}
.amount-wrap .cur{font-size:24px;font-weight:700;color:var(--muted);font-family:var(--round)}
.amount-wrap input{border:0;background:none;outline:none;text-align:left;font:800 46px var(--round);letter-spacing:-.03em;color:var(--text);width:4.2ch;max-width:78%;padding:0;font-variant-numeric:tabular-nums}
.amount-wrap.inc input{color:var(--pos)}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);background:none;border:0;padding:8px 2px;border-radius:16px;transition:background .2s;min-width:0}
.cat span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cat.on{background:rgba(10,150,236,.13);color:var(--aqua)}
.cat.on .cat-ico{transform:scale(1.1)}
.emojis{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.emojis button{width:46px;height:46px;border-radius:14px;border:0;background:var(--track);font-size:24px;transition:transform .2s}
.emojis button.on{background:rgba(10,150,236,.2);box-shadow:inset 0 0 0 2px var(--aqua);transform:scale(1.08)}
.colors{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.colors button{width:34px;height:34px;border-radius:50%;border:0;background:var(--c);box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 3px 8px -3px var(--c);transition:transform .2s}
.colors button.on{transform:scale(1.15);box-shadow:0 0 0 3px var(--glass-strong),0 0 0 5px var(--c)}
.detail-center{text-align:center;margin-bottom:16px}
.detail-center h2{margin:0;font-size:24px}
.detail-center .big{font-size:38px;font-weight:800;letter-spacing:-.03em;margin:8px 0 2px;font-family:var(--round)}
.hist{margin:16px 0 6px}
.hist .row{padding:10px 4px}
.hist .row+.row{border-top:1px solid var(--hair)}
.mini-x{border:0;background:none;color:var(--faint);font-size:16px;padding:4px 6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:1px solid var(--hair);background:var(--glass);font-size:16px;font-weight:600;text-align:left;width:100%}
.opt.on{border-color:var(--aqua);box-shadow:0 0 0 3px rgba(10,150,236,.2)}
.opt .ck{margin-left:auto;color:var(--aqua);font-weight:800}
.news{display:flex;gap:14px;align-items:flex-start;padding:10px 2px}
.news .cat-ico{margin-top:2px}
.news b{display:block;font-size:16px}
.news span{font-size:14px;color:var(--muted);line-height:1.4}

/* ============ Resumen (Wrapped) ============ */
.wr-wrap{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:4px 18px 8px;scrollbar-width:none}
.wr-wrap::-webkit-scrollbar{display:none}
.wr{position:relative;overflow:hidden;flex:0 0 100%;scroll-snap-align:center;min-height:400px;border-radius:28px;padding:28px 24px;color:#fff;display:flex;flex-direction:column;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 18px 36px -18px rgba(0,0,0,.5)}
.wr::before{left:-10%;right:-10%;top:-40%;height:80%;border-radius:50%}
.wr>*{position:relative}
.wr .k{font-size:15px;font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.06em}
.wr .v{font-family:var(--round);font-size:44px;font-weight:800;letter-spacing:-.03em;margin:10px 0;line-height:1.05;word-break:break-word}
.wr .e{font-size:84px;line-height:1;margin-bottom:8px;animation:float 3s ease-in-out infinite}
.wr p{font-size:17px;line-height:1.45;margin:0;opacity:.95}
.wr-dots{display:flex;justify-content:center;gap:7px;margin:12px 0 4px}
.wr-dots i{width:7px;height:7px;border-radius:4px;background:var(--faint);opacity:.4;transition:all .3s}
.wr-dots i.on{width:20px;opacity:1;background:var(--aqua)}

/* ============ Toast / diálogo / PIN ============ */
.toast{position:fixed;z-index:90;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-160%);
  padding:11px 18px;border-radius:22px;font-weight:700;font-size:15px;white-space:nowrap;
  background:var(--glass-strong);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid var(--glass-border);box-shadow:var(--shadow);
  transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.toast.on{transform:translate(-50%,0)}
.dialog-wrap{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(3,20,40,.35);opacity:0;transition:opacity .25s;padding:20px}
.dialog-wrap.on{opacity:1}
.dialog{width:min(290px,100%);border-radius:20px;overflow:hidden;text-align:center;transform:scale(1.12);transition:transform .3s cubic-bezier(.3,1.3,.5,1);
  background:var(--glass-strong);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border:1px solid var(--glass-border);box-shadow:var(--shadow)}
.dialog-wrap.on .dialog{transform:scale(1)}
.dialog .bd{padding:20px 18px 16px}
.dialog h4{margin:0 0 6px;font-size:17px}
.dialog p{margin:0;font-size:14px;color:var(--muted);line-height:1.4}
.dialog .bt{display:flex;border-top:1px solid var(--hair)}
.dialog .bt button{flex:1;border:0;background:none;padding:13px;font-size:17px;color:var(--aqua)}
.dialog .bt button+button{border-left:1px solid var(--hair)}
.dialog .bt button.strong{font-weight:700}
.dialog .bt button.danger{color:var(--neg);font-weight:700}
.lock{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:30px;
  background:linear-gradient(180deg,var(--sky-a),var(--sky-b) 55%,var(--sky-c));transition:opacity .4s,transform .4s}
.lock.on{display:flex}
.lock.out{opacity:0;transform:scale(1.08)}
.lock h2{margin:0;font-size:21px;font-weight:600}
.dots{display:flex;gap:16px;margin-bottom:10px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--text);opacity:.7;transition:background .15s,transform .15s}
.dots i.f{background:var(--text);transform:scale(1.1)}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:16px}
.keys button{width:76px;height:76px;border-radius:50%;font-size:30px;font-family:var(--round);border:1px solid var(--glass-border);background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:var(--shadow),var(--inner);transition:transform .12s}
.keys button:active{transform:scale(.9);background:var(--glass-strong)}
.keys button.blank{visibility:hidden}
.keys button.del{font-size:22px;background:none;border:0;box-shadow:none}
.burst{position:fixed;z-index:95;pointer-events:none;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#fff 0 10%,rgba(120,220,255,.7) 40%,rgba(80,200,160,.3) 75%);
  animation:burst 1.3s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .bubble,.aurora,.cloud{display:none}
}
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="aurora"></div>
  <div class="waves">
    <svg class="w1" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0 60 Q150 20 300 60 T600 60 T900 60 T1200 60 V120 H0Z"/></svg>
    <svg class="w2" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0 70 Q150 35 300 70 T600 70 T900 70 T1200 70 V120 H0Z"/></svg>
  </div>
</div>

<header class="navbar" id="navbar"><span id="navtitle"></span></header>
<main id="view" class="app"></main>

<script>
'use strict';
/* =========================================================
   Aqua Finanzas 2.0 — todo se guarda en este dispositivo
   ========================================================= */
const VERSION = '2.0';
const KEY = 'aqua-finanzas-v1';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const BASE_CATS = {
  gasto: [
    {id:'comida', n:'Comida', e:'🍔', c:'#ff9f0a'},
    {id:'super', n:'Súper', e:'🛒', c:'#30d158'},
    {id:'transporte', n:'Transporte', e:'🚗', c:'#0a84ff'},
    {id:'casa', n:'Casa', e:'🏠', c:'#5e5ce6'},
    {id:'servicios', n:'Servicios', e:'💡', c:'#ffcc00'},
    {id:'salud', n:'Salud', e:'💊', c:'#ff375f'},
    {id:'salidas', n:'Salidas', e:'🎉', c:'#bf5af2'},
    {id:'ropa', n:'Ropa', e:'👕', c:'#64d2ff'},
    {id:'tecnologia', n:'Tecnología', e:'💻', c:'#30b0c7'},
    {id:'estudio', n:'Estudio', e:'📚', c:'#a2845e'},
    {id:'suscripciones', n:'Suscripciones', e:'📺', c:'#ff6482'},
    {id:'regalos', n:'Regalos', e:'🎁', c:'#ff453a'},
    {id:'mascotas', n:'Mascotas', e:'🐶', c:'#d4a373'},
    {id:'belleza', n:'Cuidado', e:'💇', c:'#f472b6'},
    {id:'deporte', n:'Deporte', e:'⚽', c:'#22c55e'},
    {id:'pagodeuda', n:'Pago deuda', e:'🧾', c:'#8b5cf6'},
    {id:'otros', n:'Otros', e:'📦', c:'#8e8e93'},
  ],
  ingreso: [
    {id:'sueldo', n:'Sueldo', e:'💼', c:'#30d158'},
    {id:'ventas', n:'Ventas', e:'🏷️', c:'#0a84ff'},
    {id:'extra', n:'Trabajo extra', e:'🛠️', c:'#ff9f0a'},
    {id:'regalo', n:'Regalo', e:'🎁', c:'#ff375f'},
    {id:'inversion', n:'Inversión', e:'📈', c:'#5e5ce6'},
    {id:'cobro', n:'Cobro', e:'🤝', c:'#14c7a5'},
    {id:'otros_i', n:'Otros', e:'💰', c:'#ffcc00'},
  ],
};
const PALETTE = ['#0a84ff','#30d158','#ff9f0a','#ff375f','#bf5af2','#5e5ce6','#14c7a5','#ffcc00','#ff6482','#64d2ff','#a2845e','#8e8e93'];
const GOAL_EMOJIS = ['🎯','✈️','🏍️','🚗','📱','💻','🏠','🎓','💍','🎮','🏖️','🐶','👟','🎸','🛡️','💰'];
const ACC_EMOJIS = ['💵','🏦','💳','🐷','📱','💼','🪙','💶'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MSHORT = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const WEEKDAYS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const CURRENCIES = [['L','Lempira (L)'],['$','Dólar ($)'],['€','Euro (€)'],['Q','Quetzal (Q)'],['₡','Colón (₡)'],['C$','Córdoba (C$)'],['MX$','Peso mexicano (MX$)']];

/* ---------- Estado ---------- */
const defaultAccounts = () => [{ id: 'cash', name: 'Efectivo', emoji: '💵', color: '#30d158', initial: 0 }];
const defaultState = () => ({
  v: 2,
  settings: { name: '', cur: 'L', theme: 'auto', pin: null, lastBackup: null, hide: false, seen: VERSION, lastAcc: 'cash' },
  accounts: defaultAccounts(),
  cats: { gasto: [], ingreso: [] },
  tx: [], debts: [], goals: [], budgets: {}, recurring: [],
});
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && d.v) return normalize(d);
  } catch (e) {}
  return defaultState();
}
function normalize(d) {
  const base = defaultState();
  const fromV1 = d.v < 2;
  const s = {
    ...base, ...d, v: 2,
    settings: { ...base.settings, ...(d.settings || {}) },
    accounts: Array.isArray(d.accounts) && d.accounts.length ? d.accounts : defaultAccounts(),
    cats: { gasto: d.cats?.gasto || [], ingreso: d.cats?.ingreso || [] },
    tx: Array.isArray(d.tx) ? d.tx : [],
    debts: Array.isArray(d.debts) ? d.debts.map(x => ({ payments: [], ...x })) : [],
    goals: Array.isArray(d.goals) ? d.goals.map(x => ({ history: [], ...x })) : [],
    budgets: d.budgets && typeof d.budgets === 'object' ? d.budgets : {},
    recurring: Array.isArray(d.recurring) ? d.recurring : (Array.isArray(d.fixed) ? d.fixed.map(f => ({ type: 'gasto', acc: 'cash', ...f })) : []),
  };
  delete s.fixed;
  const accIds = new Set(s.accounts.map(a => a.id));
  s.tx.forEach(t => { if (t.type !== 'transfer' && !accIds.has(t.acc)) t.acc = s.accounts[0].id; });
  if (fromV1) s.settings.seen = '1';
  return s;
}
let S = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('No se pudo guardar 😕'); }
}
const UI = { tab: 'inicio', month: null, txFilter: 'todos', q: '', debtDir: 'me', showClosed: false, sub: null, catType: 'gasto' };

/* ---------- Utilidades ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const toStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => toStr(new Date());
const ym = s => s.slice(0, 7);
const dt = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const daysBetween = (a, b) => Math.round((dt(b) - dt(a)) / 864e5);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const monthLabel = k => cap(MONTHS[+k.slice(5) - 1]) + ' ' + k.slice(0, 4);
const monthName = k => MONTHS[+k.slice(5) - 1];
function shiftMonth(k, d) {
  let y = +k.slice(0, 4), m = +k.slice(5) + d;
  while (m < 1) { m += 12; y--; }
  while (m > 12) { m -= 12; y++; }
  return `${y}-${pad(m)}`;
}
const nf = new Intl.NumberFormat('es-HN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf0 = new Intl.NumberFormat('es-HN', { maximumFractionDigits: 1 });
const HIDDEN = '••••';
const money = n => S.settings.hide ? S.settings.cur + ' ' + HIDDEN : (n < -0.004 ? '-' : '') + S.settings.cur + ' ' + nf.format(Math.abs(n));
function moneyShort(n) {
  if (S.settings.hide) return S.settings.cur + ' ' + HIDDEN;
  const a = Math.abs(n), sign = n < -0.004 ? '-' : '';
  if (a >= 1e6) return sign + S.settings.cur + ' ' + nf0.format(a / 1e6) + 'M';
  if (a >= 1e4) return sign + S.settings.cur + ' ' + nf0.format(a / 1e3) + 'k';
  return money(n);
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseAmt(v) {
  v = String(v || '').replace(/[^\d.,]/g, '');
  if (v.includes(',') && !v.includes('.') && /,\d{1,2}$/.test(v)) v = v.replace(',', '.');
  else v = v.replace(/,/g, '');
  const n = parseFloat(v);
  return isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : 0;
}
function firstGrapheme(s) {
  s = (s || '').trim(); if (!s) return '';
  if (window.Intl && Intl.Segmenter) { for (const g of new Intl.Segmenter().segment(s)) return g.segment; }
  return [...s][0];
}
function relDate(s) {
  const diff = daysBetween(s, todayStr());
  if (diff === 0) return 'Hoy';
  if (diff === 1) return 'Ayer';
  const d = dt(s);
  return `${d.getDate()} ${MSHORT[d.getMonth()]}` + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
}
function dayHead(s) {
  const diff = daysBetween(s, todayStr());
  if (diff === 0) return 'Hoy';
  if (diff === 1) return 'Ayer';
  const d = dt(s);
  return `${WEEKDAYS[d.getDay()]} ${d.getDate()} de ${MONTHS[d.getMonth()]}`;
}
function sinceText(s) {
  const n = daysBetween(s, todayStr());
  if (n <= 0) return 'hoy';
  if (n === 1) return 'hace 1 día';
  if (n < 30) return `hace ${n} días`;
  const m = Math.floor(n / 30);
  return m === 1 ? 'hace 1 mes' : `hace ${m} meses`;
}
const allCats = type => {
  const base = BASE_CATS[type], other = base[base.length - 1];
  return [...base.slice(0, -1), ...(S.cats[type] || []), other];
};
const catOf = (type, id) => { const l = allCats(type); return l.find(c => c.id === id) || l[l.length - 1]; };
const catIco = (c, cls = '') => `<span class="cat-ico ${cls}" style="--c:${c.c}">${c.e}</span>`;
const accOf = id => S.accounts.find(a => a.id === id) || S.accounts[0];
function avatarStyle(name) {
  let h = 0; for (const ch of name) h = (h * 31 + ch.codePointAt(0)) % 360;
  return `background:linear-gradient(140deg,hsl(${h} 85% 66%),hsl(${(h + 40) % 360} 75% 46%))`;
}
const initial = n => esc(firstGrapheme(n).toUpperCase() || '?');
const sortTx = l => [...l].sort((a, b) => b.date.localeCompare(a.date) || (b.ts || 0) - (a.ts || 0));
const monthTx = k => S.tx.filter(t => ym(t.date) === k);
function sums(l) { let i = 0, g = 0; for (const t of l) { if (t.type === 'ingreso') i += t.amount; else if (t.type === 'gasto') g += t.amount; } return { i, g }; }
const paid = d => d.payments.reduce((a, p) => a + p.amount, 0);
const remaining = d => Math.max(0, Math.round((d.amount - paid(d)) * 100) / 100);
function accBalance(a) {
  let b = +a.initial || 0;
  for (const t of S.tx) {
    if (t.type === 'transfer') { if (t.from === a.id) b -= t.amount; if (t.to === a.id) b += t.amount; }
    else if (t.acc === a.id) b += t.type === 'ingreso' ? t.amount : -t.amount;
  }
  return Math.round(b * 100) / 100;
}
const totalBalance = () => S.accounts.reduce((s, a) => s + accBalance(a), 0);
const isStandalone = () => navigator.standalone || matchMedia('(display-mode: standalone)').matches;
function hashPin(p) { let h = 5381; for (const c of 'aqua·' + p) h = ((h * 33) ^ c.charCodeAt(0)) >>> 0; return h.toString(36); }
const daysInMonth = k => new Date(+k.slice(0, 4), +k.slice(5), 0).getDate();

/* ---------- Componentes ---------- */
const ICON = {
  eye: '<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeOff: '<svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
  spark: '<svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>',
};
function seg(name, opts, val) {
  return `<div class="seg" data-seg="${name}">${opts.map(([v, l]) =>
    `<button type="button" data-v="${v}" class="${v === val ? 'on' : ''}">${l}</button>`).join('')}<i class="thumb"></i></div>`;
}
function layoutSegs(root = document) {
  $$('.seg', root).forEach(s => {
    const b = s.querySelector('button.on') || s.querySelector('button');
    const th = s.querySelector('.thumb');
    if (!b || !th || !b.offsetWidth) return;
    if (!s.dataset.ready) th.style.transition = 'none';
    th.style.left = b.offsetLeft + 'px';
    th.style.width = b.offsetWidth + 'px';
    if (!s.dataset.ready) { th.offsetWidth; th.style.transition = ''; s.dataset.ready = 1; }
  });
}
function segSelect(btn) {
  const s = btn.closest('.seg');
  $$('button', s).forEach(b => b.classList.toggle('on', b === btn));
  layoutSegs(s.parentNode);
  return btn.dataset.v;
}
function pick(el, sel, btn) { $$(sel, el).forEach(b => b.classList.toggle('on', b === btn)); }
function bar(pct, cls = '') {
  const p = Math.max(0, Math.min(100, pct));
  return `<div class="bar ${cls}"><i data-w="${p.toFixed(1)}"></i></div>`;
}
function ring(pct, size = 54, stroke = 6) {
  const r = (size - stroke) / 2, C = 2 * Math.PI * r, p = Math.max(0, Math.min(1, pct || 0));
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ef0b8"/><stop offset="1" stop-color="#0a96ec"/></linearGradient></defs>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/>
    <circle class="p" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#rg)" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${C.toFixed(2)}" data-off="${(C * (1 - p)).toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
}
const empty = (em, title, text) => `<div class="glass empty"><span class="em">${em}</span><b>${title}</b>${text}</div>`;
function txRow(t, i = 0) {
  if (t.type === 'transfer') {
    const f = accOf(t.from), to = accOf(t.to);
    return `<button class="row tap" data-act="tx" data-id="${t.id}" style="--i:${i}"><span class="cat-ico" style="--c:#8e8e93">🔄</span>
      <div class="meta"><div class="t">${esc(t.note || 'Transferencia')}</div><div class="s">${f.emoji} ${esc(f.name)} → ${to.emoji} ${esc(to.name)} · ${relDate(t.date)}</div></div>
      <div class="amt muted">${money(t.amount)}</div></button>`;
  }
  const c = catOf(t.type, t.cat), inc = t.type === 'ingreso';
  const accTxt = S.accounts.length > 1 ? ` · ${accOf(t.acc).emoji}` : '';
  return `<button class="row tap" data-act="tx" data-id="${t.id}" style="--i:${i}">${catIco(c)}
    <div class="meta"><div class="t">${esc(t.note || c.n)}</div><div class="s">${esc(c.n)} · ${relDate(t.date)}${accTxt}</div></div>
    <div class="amt ${inc ? 'pos' : ''}">${S.settings.hide ? '' : inc ? '+' : '−'}${money(t.amount)}</div></button>`;
}
function countUp(root = document) {
  $$('[data-count]', root).forEach(el => {
    const to = +el.dataset.count; el.removeAttribute('data-count');
    if (reduceMotion || !to || S.settings.hide) { el.textContent = money(to); return; }
    const t0 = performance.now(), dur = 900;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4);
      el.textContent = money(to * e);
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
function postRender(root = document) {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $$('[data-w]', root).forEach(el => { el.style.width = el.dataset.w + '%'; el.removeAttribute('data-w'); });
    $$('[data-h]', root).forEach(el => { el.style.height = el.dataset.h + '%'; el.removeAttribute('data-h'); });
    $$('circle[data-len]', root).forEach(c => { c.setAttribute('stroke-dasharray', c.dataset.len + ' ' + c.dataset.rest); c.removeAttribute('data-len'); });
    $$('circle[data-off]', root).forEach(c => { c.setAttribute('stroke-dashoffset', c.dataset.off); c.removeAttribute('data-off'); });
    layoutSegs(root);
    countUp(root);
  }));
}

/* ---------- Render principal ---------- */
const TITLES = { inicio: 'Inicio', movs: 'Movimientos', deudas: 'Deudas', mas: 'Más' };
const SUBTITLES = { metas: 'Metas', presupuestos: 'Presupuestos', recurrentes: 'Recurrentes', cuentas: 'Cuentas', categorias: 'Categorías' };
function render(anim = false) {
  const v = $('#view');
  const views = { inicio: vInicio, movs: vMovs, deudas: vDeudas, mas: vMas };
  v.innerHTML = views[UI.tab]();
  if (anim) { v.classList.remove('view-anim'); v.offsetWidth; v.classList.add('view-anim'); }
  $$('.dk').forEach(t => t.classList.toggle('on', t.dataset.id === UI.tab));
  $('#navtitle').textContent = UI.tab === 'mas' && UI.sub ? SUBTITLES[UI.sub] : TITLES[UI.tab];
  if (UI.tab === 'movs') renderMovList();
  if (UI.tab === 'deudas') renderDebtList();
  postRender(v);
}
addEventListener('scroll', () => $('#navbar').classList.toggle('show', scrollY > 56), { passive: true });

/* ===== Inicio ===== */
function vInicio() {
  const m = UI.month, list = monthTx(m), { i, g } = sums(list), bal = i - g;
  const owed = S.debts.filter(d => d.dir === 'me' && !d.closed).reduce((a, d) => a + remaining(d), 0);
  const owe = S.debts.filter(d => d.dir === 'yo' && !d.closed).reduce((a, d) => a + remaining(d), 0);
  const hr = new Date().getHours();
  const greet = hr < 12 ? 'Buenos días ☀️' : hr < 19 ? 'Buenas tardes 🌤️' : 'Buenas noches 🌙';
  const name = S.settings.name;
  let h = `<header class="top"><div class="hello"><small>${greet}</small><h1>${name ? esc(name) : 'Mis finanzas'}</h1></div>
    <div class="top-actions"><button class="icon-btn tap" data-act="hide" aria-label="Ocultar montos">${S.settings.hide ? ICON.eyeOff : ICON.eye}</button>
    <button class="avatar tap" data-act="tab" data-id="mas">${name ? initial(name) : '💧'}</button></div></header>`;

  if (!isStandalone() && !localStorage.getItem('aqua-hint-off')) {
    h += `<div class="glass banner"><span style="font-size:26px">📲</span><div style="flex:1">Instalala: tocá <b>Compartir</b> y luego <b>“Agregar a pantalla de inicio”</b>.</div><button class="x" data-act="hint-off">✕</button></div>`;
  }
  const bk = S.settings.lastBackup;
  if (S.tx.length >= 5 && (!bk || daysBetween(bk, todayStr()) > 14)) {
    h += `<button class="glass banner tap" data-act="backup" style="width:100%;text-align:left"><span style="font-size:26px">💾</span><div style="flex:1"><b>${bk ? 'Hace ' + daysBetween(bk, todayStr()) + ' días' : 'Nunca'}</b> que no hacés respaldo. Tocá para guardarlo.</div><span class="chev">›</span></button>`;
  }
  const prev = shiftMonth(ym(todayStr()), -1);
  if (new Date().getDate() <= 7 && monthTx(prev).length) {
    h += `<button class="promo tap gloss" data-act="wrapped" data-id="${prev}"><span class="em">🎁</span><div style="flex:1;position:relative"><b>Tu resumen de ${monthName(prev)}</b><small>Mirá cómo te fue el mes pasado</small></div><span class="chev" style="color:#fff">›</span></button>`;
  }

  h += `<section class="window">
    <div class="titlebar"><span class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></span>
      <div class="mnav"><button data-act="month" data-d="-1" aria-label="Mes anterior">‹</button><span>${cap(MSHORT[+m.slice(5) - 1])} ${m.slice(0, 4)}</span><button data-act="month" data-d="1" aria-label="Mes siguiente">›</button></div>
      <span class="wbtn"><button data-act="wrapped" data-id="${m}" aria-label="Resumen del mes">${ICON.spark}</button></span></div>
    <div class="wbody"><span class="label">Balance del mes</span>
      <div class="big" data-count="${bal}">${money(bal)}</div>
      <div class="pills"><div class="pill"><small>↓ Entró</small><b data-count="${i}">${money(i)}</b></div>
        <div class="pill"><small>↑ Salió</small><b data-count="${g}">${money(g)}</b></div></div></div></section>`;

  h += `<div class="sec" style="margin-top:20px"><h3>Tu dinero</h3><button data-act="sub" data-id="cuentas">Cuentas</button></div>
    <div class="accs stagger"><button class="glass acc total tap" data-act="sub" data-id="cuentas" style="--i:0"><span class="h">✨ Disponible</span><b data-count="${totalBalance()}">${money(totalBalance())}</b></button>
    ${S.accounts.map((a, k) => `<button class="glass acc tap" data-act="acc" data-id="${a.id}" style="--i:${k + 1}"><span class="h">${a.emoji} ${esc(a.name)}</span><b>${money(accBalance(a))}</b></button>`).join('')}
    <button class="glass acc add tap" data-act="new-acc" aria-label="Nueva cuenta" style="--i:${S.accounts.length + 1}">＋</button></div>`;

  h += `<div class="grid2" style="margin-top:8px">
    <button class="glass mini tap" data-act="go-debts" data-id="me"><span class="mini-ico" style="--c:#14c78a">🤝</span><small>Te deben</small><b class="pos" data-count="${owed}">${money(owed)}</b></button>
    <button class="glass mini tap" data-act="go-debts" data-id="yo"><span class="mini-ico" style="--c:#ff7a45">💸</span><small>Debés</small><b class="neg" data-count="${owe}">${money(owe)}</b></button></div>`;

  h += alertsBlock();
  h += insightsBlock();
  h += `<div class="sec"><h3>¿En qué se va?</h3></div>` + donut();
  h += barsBlock();

  if (S.goals.length) {
    h += `<div class="sec"><h3>Metas</h3><button data-act="sub" data-id="metas">Ver todas</button></div><div class="goals-row stagger">` +
      S.goals.map((gl, k) => `<button class="glass gmini tap" data-act="goal" data-id="${gl.id}" style="--i:${k}">
        <div class="rw">${ring(gl.saved / gl.target)}<span>${gl.emoji}</span></div>
        <b>${esc(gl.name)}</b><small>${Math.floor(Math.min(1, gl.saved / gl.target) * 100)}% · ${moneyShort(gl.saved)}</small></button>`).join('') + `</div>`;
  }

  const recent = sortTx(S.tx).slice(0, 6);
  h += `<div class="sec"><h3>Recientes</h3>${S.tx.length ? '<button data-act="tab" data-id="movs">Ver todo</button>' : ''}</div>`;
  h += recent.length
    ? `<div class="glass list stagger">${recent.map(txRow).join('')}</div>`
    : empty('🫧', '¡Empecemos!', 'Tocá el botón <b>+</b> para anotar tu primer gasto o ingreso.');
  return h;
}
function insightsBlock() {
  const k = UI.month, cur = ym(todayStr());
  const { g } = sums(monthTx(k));
  if (!g || k > cur) return '';
  const elapsed = k === cur ? new Date().getDate() : daysInMonth(k);
  const avg = g / elapsed, proj = k === cur ? avg * daysInMonth(k) : g;
  // compara contra lo gastado hasta el mismo día del mes anterior
  const prevG = sums(monthTx(shiftMonth(k, -1)).filter(t => +t.date.slice(8) <= elapsed)).g;
  let cmp = '—', cls = '';
  if (prevG) {
    const p = (g - prevG) / prevG * 100;
    cmp = (p > 0 ? '▲ ' : '▼ ') + Math.abs(Math.round(p)) + '%';
    cls = p > 0 ? 'neg' : 'pos';
  }
  return `<div class="sec"><h3>Datos del mes</h3></div><div class="grid3 stagger">
    <div class="glass tile" style="--i:0"><small>Promedio por día</small><b>${moneyShort(avg)}</b></div>
    <div class="glass tile" style="--i:1"><small>${k === cur ? 'Al ritmo actual cerrás en' : 'Total gastado'}</small><b>${moneyShort(proj)}</b></div>
    <div class="glass tile" style="--i:2"><small>${k === cur ? 'vs. mismo día de ' : 'vs. '}${MSHORT[+shiftMonth(k, -1).slice(5) - 1]}</small><b class="${cls}">${cmp}</b></div></div>`;
}
function alertsBlock() {
  const cur = ym(todayStr()), today = new Date().getDate();
  const rows = [];
  S.recurring.forEach(f => {
    if (f.lastPaid === cur) return;
    const diff = Math.min(f.day, daysInMonth(cur)) - today;
    if (diff > 5) return;
    const inc = f.type === 'ingreso';
    const chip = diff < 0 ? `<span class="chip ${inc ? 'warn' : 'bad'}">${inc ? 'Pendiente' : 'Vencido'}</span>` : diff === 0 ? `<span class="chip warn">Hoy</span>` : `<span class="chip warn">En ${diff} día${diff > 1 ? 's' : ''}</span>`;
    rows.push(`<div class="alert-row">${catIco(catOf(f.type, f.cat), 'sm')}<div class="meta"><div class="t">${esc(f.name)}</div><div class="s">${money(f.amount)} · día ${f.day}</div></div>${chip}<button class="chip go ${inc ? 'inc' : ''}" data-act="pay-rec" data-id="${f.id}">${inc ? 'Recibí' : 'Pagar'}</button></div>`);
  });
  const spent = spentByCat(cur);
  Object.entries(S.budgets).forEach(([cat, lim]) => {
    if (!lim) return;
    const s = spent[cat] || 0, p = s / lim;
    if (p < 0.8) return;
    const c = catOf('gasto', cat);
    rows.push(`<div class="alert-row">${catIco(c, 'sm')}<div class="meta"><div class="t">Presupuesto de ${esc(c.n)}</div><div class="s">${money(s)} de ${money(lim)}</div></div><span class="chip ${p >= 1 ? 'bad' : 'warn'}">${p >= 1 ? 'Te pasaste' : Math.round(p * 100) + '%'}</span></div>`);
  });
  if (!rows.length) return '';
  return `<div class="sec"><h3>Pendientes</h3></div><div class="glass list">${rows.join('')}</div>`;
}
function spentByCat(k) {
  const by = {};
  monthTx(k).filter(t => t.type === 'gasto').forEach(t => by[t.cat] = (by[t.cat] || 0) + t.amount);
  return by;
}
function donut() {
  const by = spentByCat(UI.month);
  const total = Object.values(by).reduce((a, b) => a + b, 0);
  if (!total) return `<div class="glass card muted" style="text-align:center;padding:24px">Sin gastos en ${monthName(UI.month)} todavía ✨</div>`;
  const rows = Object.entries(by).map(([id, v]) => ({ c: catOf('gasto', id), v })).sort((a, b) => b.v - a.v);
  const r = 48, C = 2 * Math.PI * r; let off = 0;
  const segs = rows.map(x => {
    const len = x.v / total * C, gap = rows.length > 1 ? Math.min(2.2, len * 0.35) : 0;
    const s = `<circle class="s" r="${r}" cx="60" cy="60" fill="none" stroke="${x.c.c}" stroke-width="15" stroke-dasharray="0 ${C.toFixed(2)}" data-len="${(len - gap).toFixed(2)}" data-rest="${(C - len + gap).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`;
    off += len; return s;
  }).join('');
  const shown = rows.slice(0, 5), rest = rows.slice(5).reduce((a, x) => a + x.v, 0);
  return `<div class="glass card donut-card"><div class="donut"><svg viewBox="0 0 120 120">
      <circle r="${r}" cx="60" cy="60" fill="none" stroke="var(--track)" stroke-width="15"/><g transform="rotate(-90 60 60)">${segs}</g></svg>
      <div class="donut-center"><small>Gastado</small><b>${money(total)}</b></div></div>
    <div class="legend">${shown.map(x => `<div class="lg"><i style="background:${x.c.c}"></i><span>${x.c.e} ${esc(x.c.n)}</span><b>${Math.round(x.v / total * 100)}%</b></div>`).join('')}
    ${rest ? `<div class="lg"><i style="background:#8e8e93"></i><span>Lo demás</span><b>${Math.round(rest / total * 100)}%</b></div>` : ''}</div></div>`;
}
function barsBlock() {
  const ms = []; for (let k = 5; k >= 0; k--) ms.push(shiftMonth(UI.month, -k));
  const data = ms.map(m => ({ m, ...sums(monthTx(m)) }));
  if (data.every(d => !d.i && !d.g)) return '';
  const max = Math.max(1, ...data.flatMap(d => [d.i, d.g]));
  const h = v => v ? Math.max(3, v / max * 100).toFixed(1) : 0;
  return `<div class="sec"><h3>Últimos 6 meses</h3></div><div class="glass card"><div class="bars">${data.map(d =>
    `<div class="bcol ${d.m === UI.month ? 'cur' : ''}"><div class="bpair"><i class="bi" data-h="${h(d.i)}"></i><i class="bg" data-h="${h(d.g)}"></i></div><span>${MSHORT[+d.m.slice(5) - 1]}</span></div>`).join('')}</div>
    <div class="blegend"><span><i class="bi"></i>Ingresos</span><span><i class="bg"></i>Gastos</span></div></div>`;
}

function renderMovList() {

  const q = UI.q.trim().toLowerCase();

  let list = q ? S.tx.filter(t => ((t.note || '') + ' ' + label(t)).toLowerCase().includes(q)) : monthTx(UI.month);
  if (UI.txFilter !== 'todos') list = list.filter(t => t.type === UI.txFilter);

  if (!list.length) {
    el.innerHTML = q ? empty('🔍', 'Nada por aquí', `No encontré “${esc(UI.q)}”.`) : empty('🫧', 'Mes tranquilo', 'No hay movimientos en este mes.');
    return;
  }
  const { i, g } = sums(list);
  const groups = {};
  list.forEach(t => (groups[t.date] = groups[t.date] || []).push(t));
  let k = 0;
  el.innerHTML = `<div class="sumline"><div class="glass"><small>Entró</small><b class="pos">${money(i)}</b></div><div class="glass"><small>Salió</small><b>${money(g)}</b></div></div>` +

        <div class="glass list stagger">${ts.map(t => txRow(t, k++)).join('')}</div>`;
    }).join('');
}

function vDeudas() {

function renderDebtList() {
  const el = $('#debtlist'); if (!el) return;
  const me = UI.debtDir === 'me';
  const all = S.debts.filter(d => d.dir === UI.debtDir);
  const open = all.filter(d => !d.closed).sort((a, b) => a.date.localeCompare(b.date));
  const closed = all.filter(d => d.closed).sort((a, b) => (b.closedAt || '').localeCompare(a.closedAt || ''));
  const total = open.reduce((a, d) => a + remaining(d), 0);
  const people = new Set(open.map(d => d.person.trim().toLowerCase())).size;
  let h = `<section class="window ${me ? 'green' : 'orange'}"><div class="titlebar"><span class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></span></div>
    <div class="wbody"><span class="label">${me ? 'En total te deben' : 'En total debés'}</span>
    <div class="big" data-count="${total}">${money(total)}</div><div class="sub">${people ? `${people} persona${people > 1 ? 's' : ''} · ${open.length} pendiente${open.length > 1 ? 's' : ''}` : 'Todo al día 🎉'}</div></div></section>`;
  if (!open.length && !closed.length) {
    h += empty(me ? '🤝' : '🧾', me ? 'Nadie te debe' : 'No debés nada', me ? 'Cuando le prestés a alguien, anotalo aquí para no olvidarlo.' : 'Si alguien te presta, anotalo aquí para llevar control.');
  }
  h += `<div class="stagger">${open.map(debtCard).join('')}</div>`;
  if (closed.length) {
    h += `<button class="toggle-link" data-act="toggle-closed">${UI.showClosed ? 'Ocultar' : 'Ver'} saldadas (${closed.length})</button>`;
    if (UI.showClosed) h += `<div class="stagger">${closed.map(debtCard).join('')}</div>`;

}
function debtCard(d, i) {
  const rem = remaining(d), pct = d.amount ? paid(d) / d.amount * 100 : 0;
  return `<button class="glass dcard tap ${d.closed ? 'closed' : ''}" data-act="debt" data-id="${d.id}" style="--i:${i}">
    <div class="top-r"><span class="av" style="${avatarStyle(d.person)}">${initial(d.person)}</span>
      <div class="meta"><div class="t">${esc(d.person)}</div><div class="s">${d.note ? esc(d.note) + ' · ' : ''}${sinceText(d.date)}</div></div>
      <div style="text-align:right"><div class="amt ${d.closed ? '' : d.dir === 'me' ? 'pos' : 'neg'}">${d.closed ? '✓ Saldada' : money(rem)}</div>
      ${d.payments.length && !d.closed ? `<div class="s muted num" style="font-size:12px">de ${money(d.amount)}</div>` : ''}</div></div>
    ${bar(d.closed ? 100 : pct)}</button>`;
}

function subBudgets() {

function subRecurring() {

/* ---------- Hoja inferior ---------- */
const sheetEl = $('#sheet'), backEl = $('#backdrop');
function openSheet(html, mount) {
  sheetEl.innerHTML = '<div class="grab"></div>' + html;
  sheetEl.scrollTop = 0;
  sheetEl.style.transform = '';
  sheetEl.onclick = null; sheetEl.onscroll = null;
  backEl.classList.add('open'); sheetEl.classList.add('open');
  document.body.classList.add('noscroll');
  if (mount) mount(sheetEl);
  const am = sheetEl.querySelector('#amt'); if (am) fitAmt(am);
  postRender(sheetEl);
}
function closeSheet() {
  if (document.activeElement) document.activeElement.blur();
  sheetEl.classList.remove('open'); backEl.classList.remove('open');
  document.body.classList.remove('noscroll');
}
backEl.addEventListener('click', closeSheet);
(() => { // deslizar hacia abajo para cerrar
  let y0 = null, dy = 0;
  sheetEl.addEventListener('touchstart', e => {
    if (sheetEl.scrollTop > 0 || e.target.closest('input,textarea,select,.cats,.emojis,.wr-wrap,.chips')) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0;
  }, { passive: true });
  sheetEl.addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy > 0) { sheetEl.classList.add('dragging'); sheetEl.style.transform = `translate(-50%,${dy}px)`; }
  }, { passive: true });
  sheetEl.addEventListener('touchend', () => {
    if (y0 === null) return;
    sheetEl.classList.remove('dragging'); sheetEl.style.transform = '';
    if (dy > 110) closeSheet();
    y0 = null;
  });
})();
const sheetHead = t => `<div class="sh-head"><h2>${t}</h2><button class="x" data-act="close" aria-label="Cerrar">✕</button></div>`;
function fitAmt(i) { i.style.width = Math.max(2.4, (i.value || i.placeholder).length * 0.62 + 0.4) + 'em'; }
function shake(el) { el.classList.remove('shake'); el.offsetWidth; el.classList.add('shake'); }
function accPicker(sel) {
  if (S.accounts.length < 2) return '';
  return `<div class="field"><span>Cuenta</span></div><div class="chips">${S.accounts.map(a =>
    `<button type="button" class="chipsel ${a.id === sel ? 'on' : ''}" data-acc="${a.id}">${a.emoji} ${esc(a.name)}</button>`).join('')}</div>`;

const accSelect = (id, sel) => `<select class="input" id="${id}">${S.accounts.map(a => `<option value="${a.id}" ${a.id === sel ? 'selected' : ''}>${a.emoji} ${esc(a.name)}</option>`).join('')}</select>`;

function catGrid(type, sel) {

function openTxSheet(tx, type = 'gasto') {
  if (tx && tx.type === 'transfer') return openTransfer(tx);
  const edit = !!tx; type = tx ? tx.type : type;
  let cat = tx ? tx.cat : allCats(type)[0].id;
  let acc = validAcc(tx ? tx.acc : S.settings.lastAcc);
  const opts = [['gasto', 'Gasto'], ['ingreso', 'Ingreso']];
  if (!edit) opts.push(['deuda', 'Deuda']);
  const ph = t => t === 'gasto' ? 'Ej: Almuerzo con amigos' : 'Ej: Pago de quincena';
  openSheet(`${sheetHead(edit ? 'Editar' : 'Nuevo')}
    ${seg('kind', opts, type)}
    <div class="amount-wrap ${type === 'ingreso' ? 'inc' : ''}" id="aw"><span class="cur">${esc(S.settings.cur)}</span><input id="amt" inputmode="decimal" placeholder="0.00" value="${tx ? tx.amount : ''}" autocomplete="off"></div>
    <div class="cats" id="cats">${catGrid(type, cat)}</div>
    ${accPicker(acc)}
    <label class="field"><span>Descripción</span><input class="input" id="note" placeholder="${ph(type)}" value="${esc(tx?.note || '')}" maxlength="80"></label>
    <label class="field"><span>Fecha</span><input class="input" id="date" type="date" value="${tx ? tx.date : todayStr()}"></label>
    <button class="btn ${type === 'ingreso' ? 'green' : ''}" id="save">${edit ? 'Guardar cambios' : 'Guardar'}</button>
    ${edit ? `<div class="btn-row"><button class="btn ghost" id="dup">Repetir hoy</button><button class="btn ghost danger" id="del">Eliminar</button></div>` : ''}`, el => {
    el.onclick = e => {
      const sb = e.target.closest('.seg button');
      if (sb) {
        const v = segSelect(sb);
        if (v === 'deuda') return openDebtForm(null, 'me');
        type = v; cat = allCats(type)[0].id;
        $('#cats').innerHTML = catGrid(type, cat);
        $('#aw').classList.toggle('inc', type === 'ingreso');
        $('#save').classList.toggle('green', type === 'ingreso');
        $('#note').placeholder = ph(type);
        return;
      }
      const cb = e.target.closest('.cat');
      if (cb) { cat = cb.dataset.cat; pick(el, '.cat', cb); return; }
      const ab = e.target.closest('[data-acc]');
      if (ab) { acc = ab.dataset.acc; pick(el, '[data-acc]', ab); return; }
      if (e.target.closest('#save')) {
        const amount = parseAmt($('#amt').value);
        if (!amount) { shake($('#aw')); return; }
        const data = { type, cat, acc, amount, note: $('#note').value.trim(), date: $('#date').value || todayStr() };
        if (edit) Object.assign(tx, data); else S.tx.push({ id: uid(), ts: Date.now(), ...data });
        S.settings.lastAcc = acc;
        save(); closeSheet(); render(); toast(edit ? 'Cambios guardados ✓' : (type === 'gasto' ? 'Gasto anotado 💸' : 'Ingreso anotado 💰'));
        return;
      }
      if (e.target.closest('#dup')) {
        S.tx.push({ ...tx, id: uid(), ts: Date.now(), date: todayStr() });
        save(); closeSheet(); render(); toast('Repetido hoy ✓'); return;
      }
      if (e.target.closest('#del')) {
        confirmDialog('¿Eliminar movimiento?', 'Esta acción no se puede deshacer.', 'Eliminar', true).then(ok => {
          if (!ok) return;
          S.tx = S.tx.filter(t => t !== tx); save(); closeSheet(); render(); toast('Eliminado');
        });
      }
    };
  });
}

        d.payments.push({ amount: a, date });
        if ($('#preg').checked) {
          const acc = $('#pacc') ? $('#pacc').value : S.accounts[0].id;
          S.tx.push({ id: uid(), ts: Date.now(), type: me ? 'ingreso' : 'gasto', cat: me ? 'cobro' : 'pagodeuda', acc, amount: a, date, note: me ? `Abono de ${d.person}` : `Pago a ${d.person}` });
        }
        let msg = 'Abono registrado 💵';
        if (remaining(d) <= 0) { d.closed = true; d.closedAt = todayStr(); msg = '¡Deuda saldada! 🎉'; burst(); }
        save(); render(); openDebtSheet(d); toast(msg); return;
      }
      if (t.closest('#wa')) { window.open(waLink(d), '_blank'); return; }
      if (t.closest('#close-d')) {
        d.closed = !d.closed; d.closedAt = d.closed ? todayStr() : null;
        if (d.closed) burst();
        save(); render(); openDebtSheet(d); toast(d.closed ? 'Marcada como saldada ✓' : 'Deuda reabierta'); return;
      }
      const pd = t.closest('[data-pdel]');
      if (pd) {
        confirmDialog('¿Borrar este abono?', 'Si se anotó en movimientos, borralo también allá.', 'Borrar', true).then(ok => {
          if (!ok) return;
          d.payments.splice(+pd.dataset.pdel, 1);
          if (remaining(d) > 0) d.closed = false;
          save(); render(); openDebtSheet(d);
        }); return;

      if (t.closest('#edit-d')) return openDebtForm(d);
      if (t.closest('#del-d')) {
        confirmDialog('¿Eliminar deuda?', `Se borrará la deuda con ${esc(d.person)} y sus abonos.`, 'Eliminar', true).then(ok => {
          if (!ok) return;
          S.debts = S.debts.filter(x => x !== d); save(); closeSheet(); render(); toast('Deuda eliminada');
        });
      }
    };
  });
}

/* ----- Resumen del mes (Wrapped) ----- */
function openWrapped(k) {
  const list = monthTx(k).filter(t => t.type !== 'transfer');
  if (!list.length) { toast(`No hay datos de ${monthName(k)} 🫧`); return; }
  const { i, g } = sums(list);
  const by = spentByCat(k);
  const top = Object.entries(by).sort((a, b) => b[1] - a[1])[0];
  const gastos = list.filter(t => t.type === 'gasto');
  const biggest = gastos.sort((a, b) => b.amount - a.amount)[0];
  const days = {}; gastos.forEach(t => days[t.date] = (days[t.date] || 0) + t.amount);
  const topDay = Object.entries(days).sort((a, b) => b[1] - a[1])[0];
  const prevG = sums(monthTx(shiftMonth(k, -1))).g;
  const saved = i - g, rate = i ? saved / i : 0;
  const mn = monthName(k);
  const slides = [];
  const add = (bg, html) => slides.push(`<div class="wr" style="background:${bg}">${html}</div>`);
  add('linear-gradient(160deg,#43ccff,#0a8de6 50%,#0a4fb8)', `<div class="e">🫧</div><div class="k">Tu ${mn}</div><div class="v">${list.length} movimientos</div><p>Entró <b>${money(i)}</b><br>Salió <b>${money(g)}</b></p>`);
  if (top) { const c = catOf('gasto', top[0]); add('linear-gradient(160deg,#ffc76e,#ff8a3d 50%,#e2503a)', `<div class="e">${c.e}</div><div class="k">Donde más gastaste</div><div class="v">${esc(c.n)}</div><p>${money(top[1])} — el ${Math.round(top[1] / g * 100)}% de tus gastos.</p>`); }
  if (biggest) { const c = catOf('gasto', biggest.cat); add('linear-gradient(160deg,#b9a2ff,#7b5cf0 50%,#4b34c4)', `<div class="e">💸</div><div class="k">Tu gasto más grande</div><div class="v">${money(biggest.amount)}</div><p>${esc(biggest.note || c.n)} · ${dayHead(biggest.date)}</p>`); }
  if (topDay) add('linear-gradient(160deg,#ff9ac1,#ff5f8f 50%,#d63a6a)', `<div class="e">📅</div><div class="k">Tu día más gastador</div><div class="v">${cap(dayHead(topDay[0]))}</div><p>Ese día se fueron ${money(topDay[1])}.</p>`);
  if (prevG && g) {
    const p = Math.round((g - prevG) / prevG * 100);
    add(p > 0 ? 'linear-gradient(160deg,#ff9d9d,#f4525c 50%,#b9202f)' : 'linear-gradient(160deg,#56e6bd,#12ae7b 50%,#0a7a5c)',
      `<div class="e">${p > 0 ? '📈' : '📉'}</div><div class="k">Comparado con ${monthName(shiftMonth(k, -1))}</div><div class="v">${p > 0 ? '+' : ''}${p}%</div><p>${p > 0 ? 'Gastaste más que el mes anterior. ¡Ojo ahí! 👀' : '¡Gastaste menos que el mes anterior! Bien hecho 👏'}</p>`);
  }
  add(saved >= 0 ? 'linear-gradient(160deg,#56e6bd,#12ae7b 50%,#0a7a5c)' : 'linear-gradient(160deg,#ffc76e,#ff8a3d 50%,#e2503a)',
    `<div class="e">${saved >= 0 ? '🏆' : '🌱'}</div><div class="k">${saved >= 0 ? 'Te quedó' : 'Gastaste de más'}</div><div class="v">${money(Math.abs(saved))}</div><p>${i ? (saved >= 0 ? `Ahorraste el ${Math.round(rate * 100)}% de lo que entró. ${rate >= 0.2 ? '¡Crack! 🔥' : '¡Vamos por más el próximo mes! 💪'}` : 'El próximo mes podés hacerlo mejor. ¡Vos podés! 💪') : 'Anotá también tus ingresos para ver cuánto ahorrás.'}</p>`);
  openSheet(`${sheetHead('Resumen de ' + mn)}<div class="wr-wrap" id="wr">${slides.join('')}</div>
    <div class="wr-dots" id="wrd">${slides.map((_, j) => `<i class="${j ? '' : 'on'}"></i>`).join('')}</div>`, el => {
    const w = $('#wr', el);
    w.onscroll = () => { const j = Math.round(w.scrollLeft / w.clientWidth); $$('#wrd i', el).forEach((d, x) => d.classList.toggle('on', x === j)); };
    el.onclick = e => { if (e.target.closest('.wr')) w.scrollBy({ left: w.clientWidth, behavior: 'smooth' }); };
  });
}

/* ----- Exportar CSV ----- */
async function exportCSV() {
  if (!S.tx.length) { toast('Todavía no hay movimientos'); return; }
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['Fecha', 'Tipo', 'Categoría', 'Descripción', 'Monto', 'Cuenta']];
  sortTx(S.tx).forEach(t => {
    if (t.type === 'transfer') rows.push([t.date, 'Transferencia', '', t.note, t.amount.toFixed(2), accOf(t.from).name + ' → ' + accOf(t.to).name]);
    else rows.push([t.date, t.type === 'ingreso' ? 'Ingreso' : 'Gasto', catOf(t.type, t.cat).n, t.note, (t.type === 'gasto' ? -t.amount : t.amount).toFixed(2), accOf(t.acc).name]);
  });
  const csv = '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n');
  await shareFile(new File([csv], `aqua-movimientos-${todayStr()}.csv`, { type: 'text/csv' }), 'Movimientos Aqua');
}
async function shareFile(file, title) {
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title }); return true; }
  } catch (e) { if (e.name === 'AbortError') return false; }
  const url = URL.createObjectURL(file), a = document.createElement('a');
  a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  return true;
}
